    try{const o=await s.json('Capture d\'écran des statistiques d\'une vidéo TikTok ou Instagram. Extrais les nombres. Convertis 12,3 k en 12300 et 1,2 M en 1200000. Mets 0 si absent. Réponds uniquement en JSON : {"views":0,"likes":0,"comments":0,"shares":0,"saves":0}',{images:[f],cache:false});

function judeText(){const L=last30();const S=L.filter(p=>p.stats&&p.stats.v);const V=S.reduce((s,p)=>s+p.stats.v,0);const E=S.reduce((s,p)=>s+(p.stats.l||0)+(p.stats.c||0)+(p.stats.sh||0)+(p.stats.sv||0),0);
  const dt=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});const by={};S.forEach(p=>{(by[p.t]=by[p.t]||[]).push(p.stats.v)});
  const cats=Object.entries(by).map(([k,a])=>[(T[k]||T.daily).n,a.reduce((s,x)=>s+x,0)/a.length,a.length]).sort((a,b)=>b[1]-a[1]);
  const pill={};L.forEach(p=>{const n=(T[p.t]||T.daily).n;pill[n]=(pill[n]||0)+1});

  let s=`RÉCAP CONTENU · Sasha Cortesi (@sashacortesi)\nPour Wissam et Raphaël, JUDE MGMT · ${dt}\n\n`;
  s+=`RYTHME\n${L.length} vidéo${L.length>1?'s':''} postée${L.length>1?'s':''} sur les 30 derniers jours. Objectif : 2 vidéos par jour pendant 3 mois (depuis le ${new Date(START+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}).\n\n`;

  return s.trim()}

  if(t==='crop'){const r=document.createElement('input');r.type='range';r.min=1;r.max=2.5;r.step=.01;r.value=crop.z;r.setAttribute('aria-label','Zoom');let pushed=false;r.oninput=()=>{if(!pushed){push();pushed=true}crop.z=+r.value;render()};r.onchange=()=>{pushed=false;updTools()};

  if(t==='text'){const i=document.createElement('input');i.type='text';i.placeholder='Ton texte à l\'écran';i.value=txt.s;i.maxLength=80;i.id='txtIn';let pushed=false;i.oninput=()=>{if(!pushed){push();pushed=true}txt.s=i.value;render()};i.onchange=()=>pushed=false;P.appendChild(i);
    P.appendChild(pills([['top','Haut'],['mid','Milieu'],['bot','Bas'],['outline','Contour'],['box','Fond blanc']],null,v=>{push();if(['top','mid','bot'].includes(v))txt.pos=v;else txt.st=v;render()}));
    [...P.querySelectorAll('.dp')].forEach(b=>{const m={Haut:'top',Milieu:'mid',Bas:'bot',Contour:'outline','Fond blanc':'box'}[b.textContent];b.setAttribute('aria-pressed',m===txt.pos||m===txt.st)});
    P.querySelector('.dpills').onclick=()=>[...P.querySelectorAll('.dp')].forEach(b=>{const m={Haut:'top',Milieu:'mid',Bas:'bot',Contour:'outline','Fond blanc':'box'}[b.textContent];b.setAttribute('aria-pressed',m===txt.pos||m===txt.st)});
    setTimeout(()=>i.focus(),50)}
  if(t==='filter'){P.appendChild(pills(Object.entries(FILT).map(([k,v])=>[k,v[0]]),filt,v=>{push();filt=v;render()}))}
  updTools()}

/* export */
function mimeOK(){return['video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||''}
let outBlob=null,outName='',linkedPost=null;
$('#edExport').onclick=async()=>{if(busy2||!segs.length)return;if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return toast('Export impossible sur ce navigateur');
  pause();closeTool();busy2=true;ensureAudio();if(again)again.gain.value=0;
  const W=1080,H=1920,ec=document.createElement('canvas');ec.width=W;ec.height=H;const eg=ec.getContext('2d');const stream=ec.captureStream(30);
  if(adest)adest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const m=mimeOK();const rec=new MediaRecorder(stream,m?{mimeType:m,videoBitsPerSecond:8e6}:undefined);const ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const TT=total();let done=0;SV.playbackRate=speed;
  try{for(let i=0;i<segs.length;i++){const g=segs[i];cur=i;await seekSrc(g.a);draw(eg,W,H);
      if(i===0)rec.start(500);else if(rec.state==='paused')rec.resume();
      await SV.play();await new Promise(res=>{const st=()=>{draw(eg,W,H);const p=(done+Math.max(0,SV.currentTime-g.a))/TT;overlay('Export en cours',Math.min(1,p),Math.round(p*100)+' %');
          if(SV.currentTime>=g.b-.02||SV.ended){SV.pause();res();return}requestAnimationFrame(st)};st()});
      done+=g.b-g.a;if(i<segs.length-1&&rec.state==='recording'&&rec.pause)rec.pause()}
    if(rec.state==='paused')rec.resume();
    outBlob=await new Promise(r=>{rec.onstop=()=>r(new Blob(ch,{type:rec.mimeType||m||'video/webm'}));rec.stop()});
    outName='reel-'+new Date().toISOString().slice(0,10)+'-'+uid().slice(0,4)+'.'+(outBlob.type.includes('mp4')?'mp4':'webm');
    if(linkedPost){const lp=posts.find(x=>x.id===linkedPost);if(lp&&lp.s<2){lp.s=2;save()}}
    overlay(null);$('#resV').src=URL.createObjectURL(outBlob);$('#res').hidden=false;$('#resV').play().catch(()=>{})}
  catch(e){overlay(null);toast('L\'export a échoué')}
  finally{busy2=false;if(again)again.gain.value=1;seekE(0)}};
$('#resBack').onclick=()=>{$('#resV').pause();$('#res').hidden=true};
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
$('#resSave').onclick=async()=>{if(!outBlob)return;const dl=await dlP;
  if(dl){try{await dl.save({filename:outName,data:outBlob});toast('Enregistré')}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('Patiente une seconde');toast('Enregistrement impossible ici')}return}
  try{const f=new File([outBlob],outName,{type:outBlob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=$('#resV').src;a.download=outName;document.body.appendChild(a);a.click();a.remove();toast('Téléchargé')};

renderHome();route();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
</script>

<script>
/* Mise à jour auto : si une version plus récente existe en ligne, on la recharge (évite le cache de l'icône) */
(()=>{const mark=document.documentElement.getAttribute('data-build');if(!mark)return;
const chk=()=>fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/data-build="([^"]+)"/);
  if(m&&m[1]!==mark){let k='upd:'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1)}catch(e){}location.replace(location.pathname+'?v='+m[1]+location.hash)}}).catch(()=>{});
chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});})();
</script>
