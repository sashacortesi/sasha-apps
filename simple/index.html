<!doctype html>
<html lang="fr" data-build="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libre"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../libre/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<title>Libre</title>
<style>
:root{--bg:#000;--card:#111214;--card2:#1C1D20;--ink:#F5F5F7;--muted:#8A8D93;--line:#232428;--good:#4ADE80;--bad:#FF6B6B;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F7F7F8;--card:#FFFFFF;--card2:#EFEFF1;--ink:#0B0B0C;--muted:#71747A;--line:#E6E6E9;--good:#16A34A;--bad:#DC2626;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
button:active{opacity:.7}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.app{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.hi{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px}
.hi small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.hi b{font-size:26px;font-weight:700;letter-spacing:-.025em}
.gear{border:1px solid var(--line);background:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:19px;height:19px}
.big{border-radius:20px;padding:22px 20px 20px;background:var(--card);border:1px solid var(--line);display:grid;gap:6px}
.big small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.big strong{font-size:52px;font-weight:700;letter-spacing:-.045em;line-height:1}
.big strong.neg{color:var(--bad)}
.big span{font-size:14px;font-weight:500;color:var(--muted)}
.mbar{height:3px;border-radius:2px;background:var(--card2);overflow:hidden;margin-top:10px}.mbar i{display:block;height:100%;background:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:1px solid var(--line);border-radius:18px;padding:16px;min-height:112px;background:var(--card);display:grid;align-content:space-between;justify-items:start;text-align:left;gap:14px}
.act .ib{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center}
.act b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.act small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 0}
.sec h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec small{color:var(--muted);font-size:13px;font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.li:last-child{border-bottom:0}
.ck{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--muted);display:grid;place-items:center;color:transparent}
.ck svg{width:14px;height:14px;stroke-width:2.4}
.li.done .ck{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.li .t{font-size:16px;font-weight:500}
.li .t small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.li .r{font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.empty{padding:18px 16px;color:var(--muted);font-size:14px}
/* Écran plein : une action */
.fl{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.ft{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:none;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--ink)}
.back svg{width:18px;height:18px}
.prog{height:2px;border-radius:1px;background:var(--card2);overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.fb{display:grid;align-content:start;gap:18px;padding-top:32px;overflow-y:auto}
.q{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.12;margin:0}
.qs{margin:-8px 0 0;color:var(--muted);font-size:15px;font-weight:500;line-height:1.4}
.amt{font-size:60px;font-weight:700;letter-spacing:-.045em;text-align:center;padding:16px 0 8px;min-height:92px}
.amt span{color:var(--muted);font-weight:500}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{border:0;border-radius:14px;background:var(--card);font-size:26px;font-weight:500;padding:15px 0;display:grid;place-items:center}
.pad svg{width:24px;height:24px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:12px;justify-items:start;text-align:left;min-height:92px;align-content:space-between;position:relative}
.tile .ib{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--ink)}
.tile .ib svg{width:19px;height:19px}
.tile b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.tile small{font-size:13px;color:var(--muted);font-weight:500}
.tile.one{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr auto;align-items:center;padding:14px 16px}
.tile.one::after{content:"";width:8px;height:8px;border-right:1.6px solid var(--muted);border-top:1.6px solid var(--muted);transform:rotate(45deg);margin-right:4px}
.tile.one:not(:has(.ib)){grid-template-columns:1fr auto}
.tile.noi{min-height:0;padding:18px 16px}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:2px}
.txt{width:100%;border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:none;padding:12px 0;font-size:24px;font-weight:600;color:var(--ink)}
.txt:focus{outline:none;border-color:var(--ink)}
.go{width:100%;border:0;border-radius:16px;padding:18px;font-size:17px;font-weight:600;color:var(--bg);background:var(--ink)}
.go:disabled{opacity:.25}
.ok{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;align-content:center;gap:14px;animation:in .15s ease-out}
.ok div{width:72px;height:72px;border-radius:36px;border:1.5px solid var(--ink);display:grid;place-items:center;animation:sc .3s ease-out}
.ok div svg{width:32px;height:32px;stroke-width:2}
@keyframes sc{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ok b{font-size:22px;font-weight:700;letter-spacing:-.02em}.ok small{color:var(--muted);font-size:15px;font-weight:500;margin-top:-6px}
.dtin{position:absolute;opacity:0;width:1px;height:1px}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const ICO={cart:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.4 11h11.2L21 8H6.2"/>',resto:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 8h3"/>',fast:'<path d="M4 11h16M5 11a7 7 0 0 1 14 0M5 15h14l-1 4H6z"/>',glass:'<path d="M8 21h8M12 13v8M6 3h12l-6 10z"/>',train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l1.5-4M16 21l-1.5-4"/>',smoke:'<path d="M3 14h14v4H3zM17 14h4v4h-4M18 11c0-2 2-2 2-4M15 11c0-2 2-2 2-4"/>',bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',out:'<path d="M7 17 17 7M9 7h8v8"/>',in:'<path d="M17 7 7 17M15 17H7V9"/>',cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',calp:'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v5M9.5 15.5h5"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',bank:'<path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',gift:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8c-1.5-3-5-4-5-1.5S10 8 12 8zM12 8c1.5-3 5-4 5-1.5S14 8 12 8z"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',gym:'<path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/>',pan:'<circle cx="10" cy="13" r="6"/><path d="M16 13h6"/>',home:'<path d="M3 11 12 4l9 7M5 10v10h14V10"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',bed:'<path d="M3 18V7M3 13h18v5M21 13a4 4 0 0 0-4-4h-7v4"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12.5 10 17.5 19 7"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',plus:'<path d="M12 5v14M5 12h14"/>',next:'<path d="M5 12h14M13 6l6 6-6 6"/>',now:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',later:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',split:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16M7 9h1M16 9h1"/>',back:'<path d="M15 5l-7 7 7 7"/>',del:'<path d="M9 6h11v12H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const ic=k=>ICO[k]?`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`:'';
const K='libreSimple:v1';
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=iso(new Date()),YM=today.slice(0,7);
const pd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d)};
const nYM=(()=>{const d=new Date(+YM.slice(0,4),+YM.slice(5,7),1);return iso(d).slice(0,7)})();
const eur=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' €';
const eur0=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=(p=8)=>{if(navigator.vibrate)navigator.vibrate(p)};
const JN=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'],MN=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const dLab=k=>k===today?'Aujourd’hui':k===addD(today,1)?'Demain':JN[pd(k).getDay()].replace(/^./,c=>c.toUpperCase())+' '+pd(k).getDate()+' '+MN[pd(k).getMonth()];

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||typeof S!=='object')S={};
for(const k of ['inc','e','debts','ag'])if(!Array.isArray(S[k]))S[k]=[];
if(S.fixe==null)S.fixe=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const CATS=[['courses','cart','Courses'],['resto','resto','Resto'],['ff','fast','Fast-food'],['sorties','glass','Sorties'],['transport','train','Transport'],['conso','smoke','Clopes / conso'],['shopping','bag','Shopping'],['autre','dots','Autre']];
const CN=Object.fromEntries(CATS.map(c=>[c[0],c]));CN.dette=['dette','users','Dette remboursée'];
const PCOL=['#5B5BF0','#13B5A0','#E0703A','#B65BD9','#D63B3B','#0F766E','#C27803'];
const pk=n=>n.trim().toLowerCase();
const pcol=n=>{let h=0;for(const c of pk(n))h=(h*31+c.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]};

/* ---------- Calculs ---------- */
const incM=()=>S.inc.filter(x=>x.d.startsWith(YM)).reduce((a,x)=>a+x.v,0);
const spentM=()=>S.e.filter(x=>x.d.startsWith(YM)).reduce((a,x)=>a+x.v,0);
const debtDue=()=>S.debts.filter(x=>x.w==='me'&&x.pm&&x.pm<=YM).reduce((a,x)=>a+x.v,0);
const reste=()=>incM()-(S.fixe||0)-spentM()-debtDue();
const people=()=>{const m=new Map();for(const x of S.debts)if(!m.has(pk(x.p)))m.set(pk(x.p),x.p);for(const p of (S.ppl||[]))if(!m.has(pk(p)))m.set(pk(p),p);return [...m.values()]};

/* ---------- Accueil ---------- */
function home(){const r=reste(),now=new Date(),left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
  const its=S.ag.filter(a=>a.d===today).sort((a,b)=>(a.h||'99').localeCompare(b.h||'99'));
  const next=S.ag.filter(a=>a.d>today).sort((a,b)=>(a.d+(a.h||'99')).localeCompare(b.d+(b.h||'99'))).slice(0,3);
  const me=S.debts.filter(x=>x.w==='me').reduce((a,x)=>a+x.v,0),th=S.debts.filter(x=>x.w==='them').reduce((a,x)=>a+x.v,0);
  const dn=its.filter(a=>a.done).length;
  $('#app').innerHTML=`
  <div class="hi"><span><small>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}</small><b>${new Date().getHours()<18?'Bonjour':'Bonsoir'}${S.name?', '+esc(S.name):''}</b></span><button class="gear" id="set" aria-label="Réglages">${ic('gear')}</button></div>
  <div class="big"><small>Reste ce mois-ci</small><strong class="${r<0?'neg':''}">${eur0(r)}</strong><span>${r>0?eur0(r/left)+' par jour jusqu’au '+new Date(now.getFullYear(),now.getMonth()+1,0).getDate()+' '+MN[now.getMonth()]:r<0?'Dans le rouge ce mois-ci':'Ajoute ce que tu gagnes pour commencer'}</span>${incM()>0?`<div class="mbar"><i style="width:${Math.max(0,Math.min(100,(1-r/Math.max(1,incM()))*100))}%"></i></div>`:''}</div>
  <div class="acts">
   <button class="act" data-a="dep"><span class="ib">${ic('out')}</span><span><b>J’ai dépensé</b><small>${eur0(spentM())} ce mois</small></span></button>
   <button class="act" data-a="inc"><span class="ib">${ic('in')}</span><span><b>J’ai reçu</b><small>${eur0(incM())} ce mois</small></span></button>
   <button class="act" data-a="ag"><span class="ib">${ic('cal')}</span><span><b>Je prévois</b><small>${its.length?dn+'/'+its.length+' faits aujourd’hui':'Rien aujourd’hui'}</small></span></button>
   <button class="act" data-a="debts"><span class="ib">${ic('users')}</span><span><b>Dettes</b><small>${me||th?(me?'Tu dois '+eur0(me):'')+(me&&th?' · ':'')+(th?'On te doit '+eur0(th):''):'Aucune'}</small></span></button>
  </div>
  <div class="sec"><h2>Aujourd’hui</h2><small>${its.length?dn+' / '+its.length:''}</small></div>
  <div class="list">${its.length?its.map(a=>`<button class="li ${a.done?'done':''}" data-ck="${a.id}"><span class="ck">${ic('check')}</span><span class="t">${esc(a.t)}</span><span class="r">${a.h||''}</span></button>`).join(''):`<div class="empty">Rien de prévu aujourd’hui.</div>`}</div>
  ${next.length?`<div class="sec"><h2>À venir</h2></div><div class="list">${next.map(a=>`<button class="li" data-ed="${a.id}"><span class="ck" style="border-style:dashed"></span><span class="t">${esc(a.t)}<small>${dLab(a.d)}</small></span><span class="r">${a.h||''}</span></button>`).join('')}</div>`:''}
  <p class="foot">Données privées, stockées sur ce téléphone.</p>`;
  $('#set').onclick=settings;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{buzz();({dep:flowDep,inc:flowInc,ag:flowAg,debts:debtList})[b.dataset.a]()});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const a=S.ag.find(x=>x.id===b.dataset.ck);a.done=!a.done;save();buzz(a.done?[10,40,10]:8);home()});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>agItem(b.dataset.ed));
}

/* ---------- Moteur : un écran = une action ---------- */
let FL=null;
function flow(steps,onDone){FL={steps,i:0,v:{},onDone};draw()}
function closeFl(){const f=$('.fl');if(f)f.remove();FL=null;document.body.style.overflow='';home()}
function nextStep(){FL.i++;let st;while((st=FL.steps[FL.i])&&st.skip&&st.skip(FL.v))FL.i++;if(FL.i>=FL.steps.length){const r=FL.onDone(FL.v);done(r);return}draw()}
function prevStep(){if(FL.i===0)return closeFl();FL.i--;let st;while(FL.i>0&&(st=FL.steps[FL.i])&&st.skip&&st.skip(FL.v))FL.i--;draw()}
function done([t,s]){const f=$('.fl');if(f)f.remove();FL=null;save();buzz([10,40,10]);const o=document.createElement('div');o.className='ok';o.innerHTML=`<div>${ic('check')}</div><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}`;document.body.appendChild(o);home();setTimeout(()=>o.remove(),1100)}
function draw(){const st=FL.steps[FL.i],n=FL.steps.filter(s=>!(s.skip&&s.skip(FL.v))).length,pos=FL.steps.slice(0,FL.i+1).filter(s=>!(s.skip&&s.skip(FL.v))).length;
  let f=$('.fl');if(f)f.remove();f=document.createElement('div');f.className='fl';document.body.style.overflow='hidden';
  const q=typeof st.q==='function'?st.q(FL.v):st.q;
  f.innerHTML=`<div class="ft"><button class="back" aria-label="Retour">${ic('back')}</button><div class="prog"><i style="width:${pos/n*100}%"></i></div><span></span></div><div class="fb"><h1 class="q">${q}</h1>${st.sub?`<p class="qs">${typeof st.sub==='function'?st.sub(FL.v):st.sub}</p>`:''}<div class="body"></div></div><div class="fbtm"></div>`;
  document.body.appendChild(f);f.querySelector('.back').onclick=()=>{buzz();prevStep()};
  const body=f.querySelector('.body'),btm=f.querySelector('.fbtm');
  if(st.type==='amount')amountUI(st,body,btm);
  else if(st.type==='tiles')tilesUI(st,body);
  else if(st.type==='text')textUI(st,body,btm);
  else if(st.type==='date')dateUI(st,body)}
function amountUI(st,body,btm){let s=FL.v[st.k]!=null?String(FL.v[st.k]).replace('.',','):'';
  body.innerHTML=`<div class="amt" id="amt"></div><div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}" ${k==='⌫'?'aria-label="Effacer"':''}>${k==='⌫'?ic('del'):k}</button>`).join('')}</div>`;
  btm.innerHTML=`<button class="go" id="go">Suivant</button>`;
  const show=()=>{body.querySelector('#amt').innerHTML=s?esc(s)+' <span>€</span>':'<span>0 €</span>';btm.querySelector('#go').disabled=!(parseFloat(s.replace(',','.'))>0)};show();
  body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{buzz(5);const k=b.dataset.k;if(k==='⌫')s=s.slice(0,-1);else if(k===','){if(!s.includes(','))s=(s||'0')+','}else{if(s.includes(',')&&s.split(',')[1].length>=2)return;if(s.replace(',','').length>=7)return;s=s==='0'?k:s+k}show()});
  btm.querySelector('#go').onclick=()=>{FL.v[st.k]=parseFloat(s.replace(',','.'));buzz();nextStep()}}
function tilesUI(st,body){const opts=typeof st.opts==='function'?st.opts(FL.v):st.opts;
  body.innerHTML=`<div class="tiles">${opts.map((o,i)=>`<button class="tile${o.one?' one':''}${o.i?'':' noi'}" data-i="${i}">${o.i?`<span class="ib">${ic(o.i)}</span>`:''}<span><b>${o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${esc(o.l)}</b>${o.s?`<br><small>${esc(o.s)}</small>`:''}</span></button>`).join('')}</div>`;
  body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];buzz();if(o.go){o.go(FL.v);return}FL.v[st.k]=o.v;nextStep()})}
function textUI(st,body,btm){body.innerHTML=`<input class="txt" id="tx" placeholder="${esc(st.ph||'')}" maxlength="60" value="${esc(FL.v[st.k]||'')}" autocomplete="off">`;
  btm.innerHTML=`<button class="go" id="go">Suivant</button>`;const i=body.querySelector('#tx'),g=btm.querySelector('#go');const chk=()=>g.disabled=!i.value.trim();chk();i.oninput=chk;
  setTimeout(()=>i.focus(),250);const fin=()=>{if(!i.value.trim())return;FL.v[st.k]=i.value.trim();nextStep()};g.onclick=fin;i.onkeydown=e=>{if(e.key==='Enter')fin()}}
function dateUI(st,body){const o=[[today,'sun','Aujourd’hui'],[addD(today,1),'moon','Demain'],[addD(today,2),'cal',dLab(addD(today,2))]];
  body.innerHTML=`<div class="tiles">${o.map(([k,i,l])=>`<button class="tile" data-d="${k}"><span class="ib">${ic(i)}</span><b>${l}</b></button>`).join('')}<label class="tile"><span class="ib">${ic('calp')}</span><b>Autre jour</b><input type="date" class="dtin" id="dd" min="${today}"></label></div>`;
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{buzz();FL.v[st.k]=b.dataset.d;nextStep()});
  const di=body.querySelector('#dd');body.querySelector('label.tile').onclick=e=>{if(e.target!==di){e.preventDefault();try{di.showPicker()}catch(_){di.focus();di.click()}}};
  di.onchange=()=>{if(di.value){FL.v[st.k]=di.value;nextStep()}}}

/* ---------- Les parcours ---------- */
function flowDep(){flow([
  {k:'v',q:'Combien tu as dépensé ?',type:'amount'},
  {k:'c',q:'C’était quoi ?',type:'tiles',opts:CATS.map(([v,i,l])=>({v,i,l}))}
 ],v=>{S.e.push({id:uid(),d:today,v:v.v,c:v.c});return['C’est noté',`${eur(v.v)} · ${CN[v.c][2]}`]})}
function flowInc(){flow([
  {k:'v',q:'Combien tu as reçu ?',type:'amount'},
  {k:'n',q:'Ça vient d’où ?',type:'tiles',opts:[{v:'Salaire',i:'brief',l:'Salaire'},{v:'Mission',i:'zap',l:'Mission / extra'},{v:'Aide',i:'bank',l:'Aide / CAF'},{v:'Cadeau',i:'gift',l:'Cadeau'},{v:'Remboursement',i:'undo',l:'Remboursement'},{v:'Autre',i:'dots',l:'Autre'}]}
 ],v=>{S.inc.push({id:uid(),d:today,v:v.v,n:v.n});return['Bien reçu',`+${eur(v.v)}`]})}
function flowAg(){const SUG=[['gym','Sport'],['cart','Courses'],['pan','Cuisiner'],['home','Ménage'],['phone','Appeler quelqu’un'],['card','Payer quelque chose'],['brief','Chercher du travail'],['bed','Au lit avant minuit']];
 flow([
  {k:'t',q:'Tu prévois quoi ?',type:'tiles',opts:[...SUG.map(([i,l])=>({v:l,i,l})),{i:'pen',l:'Autre chose',one:1,go:v=>{v.t='';v.free=1;nextStep()}}]},
  {k:'t',q:'Écris-le',type:'text',ph:'Ex. Rendez-vous banque',skip:v=>!v.free},
  {k:'d',q:'Quel jour ?',type:'date'},
  {k:'h',q:'À quel moment ?',type:'tiles',opts:[{v:'09:00',l:'Matin',s:'9 h'},{v:'12:30',l:'Midi',s:'12 h 30'},{v:'15:00',l:'Après-midi',s:'15 h'},{v:'19:00',l:'Soir',s:'19 h'},{v:'',l:'Sans heure',one:1}]}
 ],v=>{S.ag.push({id:uid(),t:v.t,d:v.d,h:v.h,done:false});return['C’est prévu',`${v.t} · ${dLab(v.d)}${v.h?' · '+v.h.replace(':','h').replace('h00','h'):''}`]})}
function agItem(id){const a=S.ag.find(x=>x.id===id);flow([
  {k:'x',q:esc(a.t),sub:dLab(a.d)+(a.h?' · '+a.h:''),type:'tiles',opts:[{i:'check',l:'C’est fait',one:1,go:()=>{a.done=true;a.d=a.d<today?a.d:today;done(['Fait',a.t])}},{i:'trash',l:'Supprimer',one:1,go:()=>{S.ag=S.ag.filter(x=>x!==a);done(['Supprimé',''])}},{i:'undo',l:'Garder',one:1,go:()=>closeFl()}]}],()=>['',''])}

/* ---------- Dettes ---------- */
function debtList(){const g=new Map();for(const x of S.debts){const k=pk(x.p);if(!g.has(k))g.set(k,{n:x.p,l:[]});g.get(k).l.push(x)}
  const grp=[...g.values()].map(o=>({...o,net:o.l.reduce((a,x)=>a+(x.w==='them'?x.v:-x.v),0)}));
  flow([{k:'x',q:'Tes dettes',sub:grp.length?'Touche une personne quand c’est réglé.':'Aucune dette en cours.',type:'tiles',opts:[
    ...grp.map(o=>({i:'user',dot:o.net<0?'var(--bad)':'var(--good)',l:o.n,s:(o.net<0?'Tu lui dois ':'Te doit ')+eur(Math.abs(o.net))+(o.l.some(x=>x.pm===nYM)?' · mois prochain':''),one:1,go:()=>person(o)})),
    {i:'plus',l:'Nouvelle dette',one:1,go:()=>flowDebt()}]}],()=>['',''])}
function person(o){const owe=o.net<0,abs=Math.abs(o.net);flow([{k:'x',q:owe?`Tu dois ${eur(abs)} à ${esc(o.n)}`:`${esc(o.n)} te doit ${eur(abs)}`,sub:o.l.map(x=>x.t?esc(x.t):'').filter(Boolean).join(' · '),type:'tiles',opts:[
   {i:'check',l:'C’est réglé',s:'On l’enlève',one:1,go:()=>{if(owe)S.e.push({id:uid(),d:today,v:Math.round(abs*100)/100,c:'dette'});S.debts=S.debts.filter(x=>pk(x.p)!==pk(o.n));done(['Réglé',`${o.n} · ${eur(abs)}`])}},
   {i:'next',l:'Le mois prochain',s:owe?'Je le rembourse en '+new Date(nYM+'-01T12:00').toLocaleDateString('fr-FR',{month:'long'}):'Il me le rend plus tard',one:1,go:()=>{o.l.forEach(x=>x.pm=nYM);done(['Décalé','Au mois prochain'])}},
   {i:'undo',l:'Retour',one:1,go:()=>debtList()}]}],()=>['',''])}
function flowDebt(){flow([
  {k:'w',q:'Dans quel sens ?',type:'tiles',opts:[{v:'me',i:'out',l:'Je dois',s:'à quelqu’un'},{v:'them',i:'in',l:'On me doit',s:'quelqu’un me doit'},{v:'sh',i:'split',l:'Note partagée',s:'moitié chacun',one:1}]},
  {k:'p',q:v=>v.w==='me'?'À qui ?':v.w==='them'?'Qui ?':'Avec qui ?',type:'tiles',opts:()=>[...people().map(p=>({v:p,i:'user',l:p})),{i:'pen',l:'Quelqu’un d’autre',one:1,go:v=>{v.p='';v.free=1;nextStep()}}]},
  {k:'p',q:'Son prénom ?',type:'text',ph:'Prénom',skip:v=>!v.free},
  {k:'v',q:v=>v.w==='sh'?'Combien en tout ?':'Combien ?',sub:v=>v.w==='sh'?'On partage en deux, moitié chacun.':'',type:'amount'},
  {k:'pay',q:'Qui a payé ?',type:'tiles',skip:v=>v.w!=='sh',opts:v=>[{v:'moi',i:'user',l:'Moi'},{v:'lui',i:'user',l:v.p}]},
  {k:'pm',q:v=>(v.w==='them'||(v.w==='sh'&&v.pay==='moi'))?'Il te rend ça quand ?':'Tu le règles quand ?',type:'tiles',opts:[{v:YM,i:'now',l:'Ce mois-ci'},{v:nYM,i:'next',l:'Le mois prochain'},{v:'',i:'later',l:'Plus tard',one:1}]}
 ],v=>{const p=v.p.trim();S.ppl=[...new Set([...(S.ppl||[]),p])];
   if(v.w==='sh'){const half=Math.round(v.v/2*100)/100;S.e.push({id:uid(),d:today,v:half,c:'sorties'});
     S.debts.push({id:uid(),p,t:'Note partagée',v:half,w:v.pay==='moi'?'them':'me',pm:v.pm,d:today,sp:1});
     return['C’est noté',v.pay==='moi'?`${p} te doit ${eur(half)}`:`Tu dois ${eur(half)} à ${p}`]}
   S.debts.push({id:uid(),p,t:'',v:v.v,w:v.w,pm:v.pm,d:today});return['C’est noté',v.w==='me'?`Tu dois ${eur(v.v)} à ${p}`:`${p} te doit ${eur(v.v)}`]})}

/* ---------- Réglages ---------- */
function settings(){flow([{k:'x',q:'Réglages',type:'tiles',opts:[
  {i:'home',l:'Mes charges fixes',s:S.fixe!=null?eur0(S.fixe)+' par mois':'Loyer, téléphone, abonnements…',one:1,go:()=>flow([{k:'f',q:'Tes charges fixes, par mois ?',sub:'Loyer + téléphone + abonnements + transport. Un seul total.',type:'amount'}],v=>{S.fixe=v.f;return['Enregistré',eur0(v.f)+' par mois']})},
  {i:'user',l:'Mon prénom',s:S.name||'',one:1,go:()=>flow([{k:'n',q:'Ton prénom ?',type:'text',ph:'Prénom'}],v=>{S.name=v.n;return['Enregistré',v.n]})},
  {i:'trash',l:'Tout effacer',s:'Repartir de zéro',one:1,go:()=>flow([{k:'x',q:'Tout effacer ?',sub:'Tes dépenses, dettes et ton agenda seront supprimés.',type:'tiles',opts:[{i:'trash',l:'Oui, tout effacer',one:1,go:()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()}},{i:'undo',l:'Non, garder',one:1,go:()=>closeFl()}]}],()=>['',''])},
  {i:'undo',l:'Retour',one:1,go:()=>closeFl()}]}],()=>['',''])}

/* ---------- Premier lancement ---------- */
function onboard(){flow([
  {k:'n',q:'Comment tu t’appelles ?',sub:'Deux questions et c’est prêt. Tes données restent sur ton téléphone.',type:'text',ph:'Ton prénom'},
  {k:'f',q:'Tes charges fixes par mois ?',sub:'Loyer, téléphone, abonnements, transport. Un seul total, à peu près.',type:'amount'}
 ],v=>{S.name=v.n;S.fixe=v.f;S.start=today;return['Bienvenue, '+v.n,'']})}

home();if(!S.name)onboard();
</script>
<script>
(()=>{const mark=document.documentElement.getAttribute('data-build');if(!mark)return;
const chk=()=>fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/data-build="([^"]+)"/);
  if(m&&m[1]!==mark){let k='upd:'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1)}catch(e){}location.replace(location.pathname+'?v='+m[1]+location.hash)}}).catch(()=>{});
chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});})();
</script>
