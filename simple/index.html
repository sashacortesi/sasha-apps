.fl{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;animation:in .18s ease-out}

.fxr.on .fv{color:var(--ink)}
.fxx{border:0;background:none;color:var(--muted);padding:4px;display:grid;place-items:center}.fxx svg{width:16px;height:16px}

.fxs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:6px}.fxs small{width:100%;color:var(--muted);font-size:13px;font-weight:600;padding:0 2px 2px}
.fxadd{border:1px dashed var(--line);border-radius:14px;background:none;padding:14px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}.fxadd svg{width:18px;height:18px}
.fxt{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 12px;font-size:15px;color:var(--muted);font-weight:500}.fxt b{font-size:22px;color:var(--ink);letter-spacing:-.02em}
.fb:has(.fxl){overflow-y:auto}
.go{width:100%;border:0;border-radius:16px;padding:18px;font-size:17px;font-weight:600;color:var(--bg);background:var(--ink)}

.ok{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;align-content:center;gap:14px;animation:in .15s ease-out}
.ok div{width:72px;height:72px;border-radius:36px;border:1.5px solid var(--ink);display:grid;place-items:center;animation:sc .3s ease-out}
.ok div svg{width:32px;height:32px;stroke-width:2}

.ok b{font-size:22px;font-weight:700;letter-spacing:-.02em}.ok small{color:var(--muted);font-size:15px;font-weight:500;margin-top:-6px}
.dtin{position:absolute;opacity:0;width:1px;height:1px}
.sf{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}

.sos{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:15px 16px;text-align:left}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost2{width:100%;border:1px solid var(--line);border-radius:16px;padding:17px;font-size:16px;font-weight:600;background:var(--card)}

const ic=k=>ICO[k]?`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`:'';
const K='libreSimple:v1';
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=iso(new Date()),YM=today.slice(0,7);

const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d)};

const eur0=n=>Math.round(n).toLocaleString('fr-FR')+' €';

const dLab=k=>k===today?'Aujourd’hui':k===addD(today,1)?'Demain':JN[pd(k).getDay()].replace(/^./,c=>c.toUpperCase())+' '+pd(k).getDate()+' '+MN[pd(k).getMonth()];

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||typeof S!=='object')S={};
for(const k of ['inc','e','debts','ag','mine','crav'])if(!Array.isArray(S[k]))S[k]=[];
if(!S.log||typeof S.log!=='object')S.log={};if(!S.ex||typeof S.ex!=='object')S.ex={};
if(S.fixe==null)S.fixe=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const CATS=[['courses','cart','Courses'],['resto','resto','Resto'],['ff','fast','Fast-food'],['sorties','glass','Sorties'],['transport','train','Transport'],['conso','folder','Fumette'],['shopping','bag','Shopping'],['autre','dots','Autre']];
const CN=Object.fromEntries(CATS.map(c=>[c[0],c]));
const FSUB=[{v:'shit',i:'hex',l:'Shit'},{v:'beuh',i:'leaf',l:'Beuh'},{v:'clopes',i:'smoke',l:'Clopes'}];const FL2=Object.fromEntries(FSUB.map(o=>[o.v,o.l]));CN.dette=['dette','users','Dette remboursée'];
const PCOL=['#5B5BF0','#13B5A0','#E0703A','#B65BD9','#D63B3B','#0F766E','#C27803'];
const pk=n=>n.trim().toLowerCase();
const pcol=n=>{let h=0;for(const c of pk(n))h=(h*31+c.charCodeAt(0))>>>0;return PCOL[h%PCOL.length]};

/* ---------- Calculs ---------- */
const incM=()=>S.inc.filter(x=>x.d.startsWith(YM)).reduce((a,x)=>a+x.v,0);
const spentM=()=>S.e.filter(x=>x.d.startsWith(YM)).reduce((a,x)=>a+x.v,0);
const debtDue=()=>S.debts.filter(x=>x.w==='me'&&x.pm&&x.pm<=YM).reduce((a,x)=>a+x.v,0);
const reste=()=>incM()-(S.fixe||0)-spentM()-debtDue();
const people=()=>{const m=new Map();for(const x of S.debts)if(!m.has(pk(x.p)))m.set(pk(x.p),x.p);for(const p of (S.ppl||[]))if(!m.has(pk(p)))m.set(pk(p),p);return [...m.values()]};

/* ---------- Accueil ---------- */
function home(){const r=reste(),now=new Date(),left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
  const its=S.ag.filter(a=>a.d===today).sort((a,b)=>(a.h||'99').localeCompare(b.h||'99'));
  const next=S.ag.filter(a=>a.d>today).sort((a,b)=>(a.d+(a.h||'99')).localeCompare(b.d+(b.h||'99'))).slice(0,3);
  const me=S.debts.filter(x=>x.w==='me').reduce((a,x)=>a+x.v,0),th=S.debts.filter(x=>x.w==='them').reduce((a,x)=>a+x.v,0);
  const dn=its.filter(a=>a.done).length;
  $('#app').innerHTML=`
  <div class="hi"><span><small>${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase())}</small><b>${new Date().getHours()<18?'Bonjour':'Bonsoir'}${S.name?', '+esc(S.name):''}</b></span><button class="gear" id="set" aria-label="Réglages">${ic('gear')}</button></div>
  <div class="big"><small>Reste ce mois-ci</small><strong class="${r<0?'neg':''}">${eur0(r)}</strong><span>${r>0?eur0(r/left)+' par jour jusqu’au '+new Date(now.getFullYear(),now.getMonth()+1,0).getDate()+' '+MN[now.getMonth()]:r<0?'Dans le rouge ce mois-ci':'Ajoute ce que tu gagnes pour commencer'}</span>${incM()>0?`<div class="mbar"><i style="width:${Math.max(0,Math.min(100,(1-r/Math.max(1,incM()))*100))}%"></i></div>`:''}</div>
  <div class="acts">
   <button class="act" data-a="dep"><span class="ib">${ic('out')}</span><span><b>J’ai dépensé</b><small>${eur0(spentM())} ce mois</small></span></button>
   <button class="act" data-a="inc"><span class="ib">${ic('in')}</span><span><b>J’ai reçu</b><small>${eur0(incM())} ce mois</small></span></button>
   <button class="act" data-a="ag"><span class="ib">${ic('cal')}</span><span><b>Je prévois</b><small>${its.length?dn+'/'+its.length+' faits aujourd’hui':'Rien aujourd’hui'}</small></span></button>
   <button class="act" data-a="debts"><span class="ib">${ic('users')}</span><span><b>Dettes</b><small>${me||th?(me?'Tu dois '+eur0(me):'')+(me&&th?' · ':'')+(th?'On te doit '+eur0(th):''):'Aucune'}</small></span></button>
  </div>
  ${smokeCard()}
  <div class="sec"><h2>Aujourd’hui</h2><small>${its.length?dn+' / '+its.length:''}</small></div>
  <div class="list">${its.length?its.map(a=>`<button class="li ${a.done?'done':''}" data-ck="${a.id}"><span class="ck">${ic('check')}</span><span class="t">${esc(a.t)}</span><span class="r">${a.h||''}</span></button>`).join(''):`<div class="empty">Rien de prévu aujourd’hui.</div>`}</div>
  ${next.length?`<div class="sec"><h2>À venir</h2></div><div class="list">${next.map(a=>`<button class="li" data-ed="${a.id}"><span class="ck" style="border-style:dashed"></span><span class="t">${esc(a.t)}<small>${dLab(a.d)}</small></span><span class="r">${a.h||''}</span></button>`).join('')}</div>`:''}
  <p class="foot">Données privées, stockées sur ce téléphone.</p>`;
  $('#set').onclick=settings;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{buzz();({dep:flowDep,inc:flowInc,ag:flowAg,debts:debtList,sos:openSOS,gains:gainsScr,vset:flowVice,lg0:()=>logZero(),lg1:flowSmoked,fume:fumeScr})[b.dataset.a]()});
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>{const a=S.ag.find(x=>x.id===b.dataset.ck);a.done=!a.done;save();buzz(a.done?[10,40,10]:8);home()});
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>agItem(b.dataset.ed));
}

/* ---------- Moteur : un écran = une action ---------- */
let FL=null;
function flow(steps,onDone){FL={steps,i:0,v:{},onDone};while(FL.steps[FL.i]&&FL.steps[FL.i].skip&&FL.steps[FL.i].skip(FL.v))FL.i++;draw()}
function closeFl(){const f=$('.fl');if(f)f.remove();FL=null;document.body.style.overflow='';home()}
function nextStep(){FL.i++;let st;while((st=FL.steps[FL.i])&&st.skip&&st.skip(FL.v))FL.i++;if(FL.i>=FL.steps.length){const r=FL.onDone(FL.v);done(r);return}draw()}
function prevStep(){if(FL.i===0)return closeFl();FL.i--;let st;while(FL.i>0&&(st=FL.steps[FL.i])&&st.skip&&st.skip(FL.v))FL.i--;draw()}
function done([t,s]){const f=$('.fl');if(f)f.remove();FL=null;save();buzz([10,40,10]);const o=document.createElement('div');o.className='ok';o.innerHTML=`<div>${ic('check')}</div><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}`;document.body.appendChild(o);home();setTimeout(()=>o.remove(),1100)}
function draw(){const st=FL.steps[FL.i],n=FL.steps.filter(s=>!(s.skip&&s.skip(FL.v))).length,pos=FL.steps.slice(0,FL.i+1).filter(s=>!(s.skip&&s.skip(FL.v))).length;
  let f=$('.fl');if(f)f.remove();f=document.createElement('div');f.className='fl';document.body.style.overflow='hidden';
  const q=typeof st.q==='function'?st.q(FL.v):st.q;
  f.innerHTML=`<div class="ft"><button class="back" aria-label="Retour">${ic('back')}</button><div class="prog"><i style="width:${pos/n*100}%"></i></div><span></span></div><div class="fb"><h1 class="q">${q}</h1>${st.sub?`<p class="qs">${typeof st.sub==='function'?st.sub(FL.v):st.sub}</p>`:''}<div class="body"></div></div><div class="fbtm"></div>`;
  document.body.appendChild(f);f.querySelector('.back').onclick=()=>{buzz();prevStep()};
  const body=f.querySelector('.body'),btm=f.querySelector('.fbtm');
  if(st.type==='amount')amountUI(st,body,btm);
  else if(st.type==='tiles')tilesUI(st,body);
  else if(st.type==='text')textUI(st,body,btm);
  else if(st.type==='date')dateUI(st,body);
  else if(st.type==='fixes')fixesUI(st,body,btm)}
function amountUI(st,body,btm){let s=FL.v[st.k]!=null?String(FL.v[st.k]).replace('.',','):'';
  body.innerHTML=`<div class="amt" id="amt"></div><div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}" ${k==='⌫'?'aria-label="Effacer"':''}>${k==='⌫'?ic('del'):k}</button>`).join('')}</div>`;
  btm.innerHTML=`<button class="go" id="go">Suivant</button>`;
  const show=()=>{body.querySelector('#amt').innerHTML=s?esc(s)+' <span>€</span>':'<span>0 €</span>';btm.querySelector('#go').disabled=!(parseFloat(s.replace(',','.'))>0)};show();
  body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{buzz(5);const k=b.dataset.k;if(k==='⌫')s=s.slice(0,-1);else if(k===','){if(!s.includes(','))s=(s||'0')+','}else{if(s.includes(',')&&s.split(',')[1].length>=2)return;if(s.replace(',','').length>=7)return;s=s==='0'?k:s+k}show()});
  btm.querySelector('#go').onclick=()=>{FL.v[st.k]=parseFloat(s.replace(',','.'));buzz();nextStep()}}
function tilesUI(st,body){const opts=typeof st.opts==='function'?st.opts(FL.v):st.opts;
  body.innerHTML=`<div class="tiles">${opts.map((o,i)=>`<button class="tile${o.one?' one':''}${o.i?'':' noi'}" data-i="${i}">${o.i?`<span class="ib">${ic(o.i)}</span>`:''}<span><b>${o.dot?`<span class="dot" style="background:${o.dot}"></span>`:''}${esc(o.l)}</b>${o.s?`<br><small>${esc(o.s)}</small>`:''}</span></button>`).join('')}</div>`;
  body.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];buzz();if(o.go){o.go(FL.v);return}FL.v[st.k]=o.v;nextStep()})}
function textUI(st,body,btm){body.innerHTML=`<input class="txt" id="tx" placeholder="${esc(st.ph||'')}" maxlength="60" value="${esc(FL.v[st.k]||'')}" autocomplete="off">`;
  btm.innerHTML=`<button class="go" id="go">Suivant</button>`;const i=body.querySelector('#tx'),g=btm.querySelector('#go');const chk=()=>g.disabled=!i.value.trim();chk();i.oninput=chk;
  setTimeout(()=>i.focus(),250);const fin=()=>{if(!i.value.trim())return;FL.v[st.k]=i.value.trim();nextStep()};g.onclick=fin;i.onkeydown=e=>{if(e.key==='Enter')fin()}}
function dateUI(st,body){const o=[[today,'sun','Aujourd’hui'],[addD(today,1),'moon','Demain'],[addD(today,2),'cal',dLab(addD(today,2))]];
  body.innerHTML=`<div class="tiles">${o.map(([k,i,l])=>`<button class="tile" data-d="${k}"><span class="ib">${ic(i)}</span><b>${l}</b></button>`).join('')}<label class="tile"><span class="ib">${ic('calp')}</span><b>Autre jour</b><input type="date" class="dtin" id="dd" min="${today}"></label></div>`;
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{buzz();FL.v[st.k]=b.dataset.d;nextStep()});
  const di=body.querySelector('#dd');body.querySelector('label.tile').onclick=e=>{if(e.target!==di){e.preventDefault();try{di.showPicker()}catch(_){di.focus();di.click()}}};
  di.onchange=()=>{if(di.value){FL.v[st.k]=di.value;nextStep()}}}

const FXS=['Téléphone','Internet','Abonnement','Assurance','Transport','Mutuelle','Sport','Crédit','Loyer'];
const FXI=[[/t[ée]l[ée]phone|forfait|mobile|portable/i,'phone'],[/internet|box|fibre|wifi/i,'zap'],[/abonn|netflix|spotify|deezer|canal|prime|disney|apple|youtube/i,'spark'],[/assur|mutuelle/i,'bank'],[/transport|navigo|essence|voiture|bus|m[ée]tro|train/i,'train'],[/sport|salle|gym|fitness/i,'gym'],[/cr[ée]dit|pr[eê]t|banque/i,'card'],[/loyer|logement|appart/i,'home'],[/[ée]lec|gaz|eau|edf|engie/i,'zap']];
const fxIc=n=>{for(const [r,i] of FXI)if(r.test(n||''))return i;return 'dots'};
const fxSeed=()=>{const L=Array.isArray(S.fx)&&S.fx.length?S.fx:(S.fixe?[{n:'Charges fixes',v:S.fixe}]:[]);return L.map(x=>({n:x.n,v:x.v}))};
const fxSum=a=>a.reduce((t,x)=>t+(x.v>0?x.v:0),0);
function fixesUI(st,body,btm){if(!FL.v[st.k])FL.v[st.k]=fxSeed();const R=FL.v[st.k];
  const tot=()=>{const t=fxSum(R);btm.querySelector('#fxt').innerHTML=R.length?`<span>Total par mois</span><b>${eur(t)}</b>`:'';btm.querySelector('#go').textContent=t?'Suivant':'Je n’en ai pas'};
  const row=(x,j)=>`<div class="fxr${x.v>0?' on':''}" data-j="${j}"><span class="ib">${ic(fxIc(x.n))}</span><span class="nm"><input class="fnm" maxlength="40" placeholder="Nom (ex. Forfait)" value="${esc(x.n||'')}"></span><label class="fv"><input inputmode="decimal" placeholder="0" value="${x.v>0?String(x.v).replace('.',','):''}" aria-label="Montant"> €</label><button class="fxx" aria-label="Supprimer">${ic('x')}</button></div>`;
  const add=(n,focusAmt)=>{buzz();R.push({n:n||'',v:null});render();const r=body.querySelectorAll('.fxr'),last=r[r.length-1];(focusAmt?last.querySelector('.fv input'):last.querySelector('.fnm')).focus()};
  const render=()=>{const used=new Set(R.map(x=>pk(x.n||'')));const sug=FXS.filter(n=>!used.has(pk(n)));

 ],v=>{const o={};keys().forEach(k=>o[k]=+(v[k]||0));S.log[today]=o;return keys().every(k=>!o[k])?['Noté','Rien fumé aujourd’hui']:['Noté','Ce n’est pas grave. Demain, on repart.']})}

/* ---------- Envie de fumer ---------- */
let sT=null,sB=null,rI=Math.floor(Math.random()*100);
const RS=()=>REASONS.filter(([k])=>k==='Toi'||(k==='Cannabis'&&has('j'))||(k==='Tabac'&&has('c')));
function closeScr(){clearInterval(sT);clearInterval(sB);clearInterval(eT);const x=$('.scr');if(x)x.remove();document.body.style.overflow='';home()}
function scr(title,html){let x=$('.scr');if(x)x.remove();x=document.createElement('div');x.className='scr';x.innerHTML=`<div class="in2"><div class="top"><button class="back" aria-label="Fermer">${ic('x')}</button><span>${title}</span><span></span></div>${html}</div>`;document.body.appendChild(x);document.body.style.overflow='hidden';x.querySelector('.back').onclick=()=>{buzz();closeScr()};return x}
function openSOS(){clearInterval(sT);clearInterval(sB);
  const won=S.crav.filter(c=>c.w).length,rs=RS();
  const x=scr('Envie de fumer',`<div class="orbw"><div class="orb" id="orb"></div><div class="orbt"><b id="bT">Inspire</b><small id="cT">3:00</small></div></div>
   <div class="rc"><small id="rK"></small><p id="rT"></p><button class="lk" id="rN">Une autre raison</button></div>
   <div class="rc"><small>Mes raisons d’arrêter</small>${S.mine.length?`<ul>${S.mine.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}<form id="mF"><input id="mI" placeholder="${S.mine.length?'Ajouter une raison':'Pourquoi tu veux arrêter ?'}" maxlength="80"><button>OK</button></form></div>
   <div class="st3">${keys().map(k=>`<div><b>${streak(k)} j</b><small>${KN[k]}</small></div>`).join('')}<div><b>${eur0(saved())}</b><small>économisés</small></div>${keys().length<2?`<div><b>${won}</b><small>envies battues</small></div>`:''}</div>
   <button class="go" id="won">J’ai tenu</button>
   <div class="two"><button class="ghost2" id="exB">Un exercice guidé</button><button class="ghost2" id="lost">J’ai craqué</button></div>`);
  const sh=()=>{const [k,t]=rs[rI%rs.length];x.querySelector('#rK').textContent=k==='Toi'?'À te rappeler':'Pourquoi ne pas fumer · '+k;x.querySelector('#rT').textContent=t};sh();
  x.querySelector('#rN').onclick=()=>{rI++;buzz();sh()};
  x.querySelector('#mF').onsubmit=e=>{e.preventDefault();const v=x.querySelector('#mI').value.trim();if(!v)return;S.mine.push(v);save();const sc=x.scrollTop;openSOS();$('.scr').scrollTop=sc};
  const o=x.querySelector('#orb'),bt=x.querySelector('#bT'),ct=x.querySelector('#cT');let inh=true;const st=()=>{o.classList.toggle('big',inh);bt.textContent=inh?'Inspire':'Expire';inh=!inh};setTimeout(st,50);sB=setInterval(st,4000);
  let sec=180;sT=setInterval(()=>{sec--;if(sec<=0){clearInterval(sT);ct.textContent='3 minutes tenues';return}ct.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},1000);
  x.querySelector('#won').onclick=()=>{S.crav.push({t:Date.now(),w:1});closeScr();const n=S.crav.filter(c=>c.w).length;done(['Envie battue',n+' envie'+(n>1?'s':'')+' battue'+(n>1?'s':'')+' au total'])};
  x.querySelector('#lost').onclick=()=>{S.crav.push({t:Date.now(),w:0});clearInterval(sT);clearInterval(sB);const z=$('.scr');if(z)z.remove();document.body.style.overflow='';flowSmoked()};
  x.querySelector('#exB').onclick=()=>{clearInterval(sT);clearInterval(sB);exList()}}

/* ---------- Exercices guidés ---------- */
let eT=null;
function exList(){const z=$('.scr');if(z)z.remove();document.body.style.overflow='';
  flow([{k:'x',q:'Un exercice',sub:'Guidé, avec minuteur. L’envie baisse pendant que tu le fais.',type:'tiles',opts:EX.map(([id,n,sub,d])=>({i:id==='sport'?'gym':id==='478'?'moon':id==='ancre'?'now':id==='detente'?'spark':'wind',l:n,s:sub+' · '+d+(S.ex[id]?' · fait '+S.ex[id]+'×':''),one:1,go:()=>{const f=$('.fl');if(f)f.remove();FL=null;startEx(id)}}))}],()=>['',''])}
function startEx(id){const E=EX.find(e=>e[0]===id),steps=E[6],tot=steps.reduce((a,s)=>a+s[2],0);let i=0,left=steps[0][2],el=0,pause=false;
  const x=scr(esc(E[1]),`<div class="exbar"><i id="eB" style="width:0"></i></div><div class="orbw"><div class="orb mid" id="eO"></div><div class="orbt"><b id="eC"></b></div></div><div class="exs" id="eS"></div><div class="exn" id="eN"></div><div class="two"><button class="ghost2" id="eP">Pause</button><button class="ghost2" id="eK">Passer</button></div>`);
  const L={in:'Inspire',out:'Expire',hold:'Bloque'};
  const show=()=>{const [m,t,d]=steps[i],o=x.querySelector('#eO');o.style.transitionDuration=(m==='t'?.6:d)+'s';o.classList.remove('big','mid');o.classList.add(m==='in'||m==='hold'?'big':m==='t'?'mid':'x');x.querySelector('#eS').textContent=t;const nx=steps[i+1];x.querySelector('#eN').textContent=nx&&nx[0]==='t'?'Ensuite : '+nx[1]:'';tick()};
  const tick=()=>{const [m]=steps[i];x.querySelector('#eC').textContent=(m==='t'?'':L[m]+' · ')+left;x.querySelector('#eB').style.width=(el/tot*100)+'%'};
  const end=()=>{clearInterval(eT);S.ex[id]=(S.ex[id]||0)+1;closeScr();done(['Exercice terminé','Si l’envie revient, recommence'])};
  show();clearInterval(eT);eT=setInterval(()=>{if(pause)return;left--;el++;if(left<=0){i++;if(i>=steps.length)return end();left=steps[i][2];buzz(12);show()}else tick()},1000);
  x.querySelector('#eP').onclick=e=>{pause=!pause;e.target.textContent=pause?'Reprendre':'Pause'};
  x.querySelector('#eK').onclick=()=>{el+=left;i++;if(i>=steps.length)return end();left=steps[i][2];show()}}

/* ---------- Ce que tu gagnes ---------- */
let gC='corps';
function gainsScr(){const G=GAINS.map(([k,n,l])=>[k,n,l.filter(it=>!it[2]||has(it[2]))]);
  const nn=it=>it[2]?streak(it[2]):best();const all=G.flatMap(g=>g[2]),got=all.filter(it=>nn(it)>=it[0]).length;
  const g=G.find(x=>x[0]===gC);let nx=false;
  const wl=d=>d<7?d+' jour'+(d>1?'s':''):d<30?(d/7)+' semaine'+(d>7?'s':''):d<365?(d/30)+' mois':'1 an';
  const x=scr('Ce que tu gagnes',`<div class="gsum"><b>${got} / ${all.length}</b><span>${got?'bienfaits débloqués. Chaque jour sans fumer en ajoute.':'Le premier arrive après 1 jour sans fumer.'}</span></div>
   <div class="st3">${keys().map(k=>`<div><b>${streak(k)} j</b><small>${KN[k]}</small></div>`).join('')}<div><b>${eur0(saved())}</b><small>économisés</small></div></div>
   <div class="chips">${G.map(([k,n])=>`<button class="chip" data-gc="${k}" aria-pressed="${k===gC}">${n}</button>`).join('')}</div>
   <div class="rc" style="padding:2px 16px">${g[2].map(it=>{const [d,t,ky]=it,n=nn(it),ok=n>=d;let c=ok?'dn':'';if(!ok&&!nx){c='next';nx=true}
     return `<div class="ms ${c}"><span class="mk">${ok?ic('check'):''}</span><span><span class="when">${wl(d)}${ky?' '+KN[ky]:''}${c==='next'?' · encore '+(d-n)+' j':''}</span><b>${t}</b></span></div>`}).join('')}</div>`);
  x.querySelectorAll('[data-gc]').forEach(b=>b.onclick=()=>{gC=b.dataset.gc;buzz();gainsScr()})}

/* ---------- Réglages ---------- */
function settings(){flow([{k:'x',q:'Réglages',type:'tiles',opts:[
  {i:'home',l:'Mes charges fixes',s:fxSub(),one:1,go:()=>flow([{k:'fx',q:'Tes charges fixes',sub:'Ajoute, renomme ou supprime ce que tu paies chaque mois.',type:'fixes'}],v=>{fxSave(v.fx);return['Enregistré',eur0(S.fixe)+' par mois']})},
  {i:'user',l:'Mon prénom',s:S.name||'',one:1,go:()=>flow([{k:'n',q:'Ton prénom ?',type:'text',ph:'Prénom'}],v=>{S.name=v.n;return['Enregistré',v.n]})},
  {i:'smoke',l:'Ma conso',s:S.vice?({c:'Clopes',j:'Joints',cj:'Clopes et joints'}[S.vice]+(S.wk?' · '+eur0(S.wk)+' par semaine avant':'')):'Pas suivie',one:1,go:()=>flowVice()},
  {i:'trash',l:'Tout effacer',s:'Repartir de zéro',one:1,go:()=>flow([{k:'x',q:'Tout effacer ?',sub:'Tes dépenses, dettes et ton agenda seront supprimés.',type:'tiles',opts:[{i:'trash',l:'Oui, tout effacer',one:1,go:()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()}},{i:'undo',l:'Non, garder',one:1,go:()=>closeFl()}]}],()=>['',''])},
  {i:'undo',l:'Retour',one:1,go:()=>closeFl()}]}],()=>['',''])}

/* ---------- Premier lancement ---------- */
function onboard(){flow([
  {k:'n',q:'Comment tu t’appelles ?',sub:'Quelques questions et c’est prêt. Tes données restent sur ton téléphone.',type:'text',ph:'Ton prénom'},
  {k:'fx',q:'Tes charges fixes',sub:'Ajoute ce que tu paies chaque mois, avec tes propres noms.',type:'fixes'},
  {k:'vice',q:'Tu fumes quoi ?',sub:'L’app t’aide à réduire, sans jugement.',type:'tiles',opts:[{v:'c',i:'smoke',l:'Des clopes'},{v:'j',i:'leaf',l:'Des joints'},{v:'cj',i:'spark',l:'Les deux',one:1},{v:'',i:'ban',l:'Je ne fume pas',one:1}]},
  {k:'wk',q:'Combien tu dépenses par semaine pour ça ?',sub:'À peu près. Ça sert à calculer l’argent que tu économises.',type:'amount',skip:v=>!v.vice}
 ],v=>{S.name=v.n;fxSave(v.fx);S.start=today;S.vice=v.vice;if(v.vice){S.wk=v.wk;S.vstart=today}return['Bienvenue, '+v.n,'']})}

home();if(!S.name)onboard();
</script>
<script>
(()=>{const mark=document.documentElement.getAttribute('data-build');if(!mark)return;
const chk=()=>fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/data-build="([^"]+)"/);
  if(m&&m[1]!==mark){let k='upd:'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1)}catch(e){}location.replace(location.pathname+'?v='+m[1]+location.hash)}}).catch(()=>{});
chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});})();
</script>
