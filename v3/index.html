<!doctype html>
<html lang="fr" data-build="5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Base 3"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2"><link rel="icon" type="image/png" href="../icons/icon-192.png?v=2"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<title>Base</title>
<style>
:root{--bg:#000;--card:#111214;--card2:#1C1D20;--ink:#F5F4F0;--muted:#8A8D93;--line:#232428;--good:#4ADE80;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F5F4F0;--card:#FFFFFF;--card2:#ECEBE6;--ink:#0C0C0D;--muted:#6E6F73;--line:#E3E2DC;--good:#15803D;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
body{min-height:100dvh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:active{opacity:.65}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 18px}
.top small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.top b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
/* héros */
.hero{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 20px 18px;display:grid;gap:6px}
.hero small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.hero strong{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1;margin:4px 0 2px}
.hero .s{font-size:15px;color:var(--muted);font-weight:500;line-height:1.35}
.hero .rc{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-weight:500}
.hero .rc svg{width:15px;height:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bb{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px 16px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;min-height:68px}
.bb.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.bb svg{width:22px;height:22px;flex:none}
.envie{width:100%;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:16px;border:1px dashed var(--line);color:var(--muted);font-size:15px;font-weight:600}
.envie svg{width:18px;height:18px}
.ctx{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.ctx .h{display:flex;gap:12px;align-items:flex-start}
.ctx .ib{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none}
.ctx .ib svg{width:20px;height:20px}
.ctx .h b{display:block;font-size:16px;font-weight:650;line-height:1.3}
.ctx .h span{display:block;font-size:14px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.35}
.ctx .acts{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:0;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 10px;font-size:15px;font-weight:600;text-align:center;white-space:nowrap}
.chip.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:480px}
.tabs button{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabs button.on{color:var(--ink)}
.tabs svg{width:23px;height:23px}
/* listes */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.sec h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.sec small,.sec button{font-size:13px;color:var(--muted);font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .ib{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center}
.li .ib svg{width:18px;height:18px}
.li .t{font-size:16px;font-weight:500;min-width:0}
.li .t small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.li .r{font-size:15px;font-weight:600;white-space:nowrap}
.li .r.m{color:var(--muted);font-weight:500}
.li.add{grid-template-columns:auto 1fr;color:var(--muted);font-weight:600}
.empty{padding:18px 16px;color:var(--muted);font-size:15px;line-height:1.4}
.big2{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:4px}
.big2 small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.big2 strong{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.big2 span{font-size:14px;color:var(--muted);font-weight:500;line-height:1.4}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.grid3 b{display:block;font-size:19px;letter-spacing:-.02em}
.grid3 small{font-size:12px;color:var(--muted);font-weight:500}
.wk7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:64px;margin-top:6px}
.wk7 i{display:block;background:var(--card2);border-radius:6px;min-height:6px}
.wk7 i.z{background:var(--good);opacity:.85}
.wk7l{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:14px 4px 0}
.note a{color:var(--ink)}
/* flux : un écran = une question */
.fl{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.fl .ft{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;max-width:480px;width:100%;margin:0 auto}
.fl .ft button{width:40px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.fl .ft button svg{width:18px;height:18px}
.fl .bar{flex:1;height:3px;border-radius:2px;background:var(--card2);overflow:hidden}.fl .bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.fl .fb{flex:1;overflow:auto;padding:18px 16px 16px;max-width:480px;width:100%;margin:0 auto}
.fl h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:8px 0 8px}
.fl .qs{font-size:15px;color:var(--muted);line-height:1.45;margin:0 0 18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;display:grid;gap:10px;min-height:92px;align-content:start}
.tile.one{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center}
.tile .ib{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center}
.tile .ib svg{width:19px;height:19px}
.tile b{font-size:16px;font-weight:650;display:block}
.tile small{font-size:13px;color:var(--muted);font-weight:500;display:block;margin-top:2px;line-height:1.3}
.tile .tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--good);margin-top:4px}
.amt{font-size:56px;font-weight:700;letter-spacing:-.04em;text-align:center;margin:18px 0 10px;min-height:68px}
.amt.ph{color:var(--muted)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:550}
.kp button svg{margin:auto}
.fbtm{padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto}
.go{width:100%;height:58px;border-radius:18px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:650}
.go:disabled{opacity:.3}
.txt{width:100%;font:inherit;font-size:20px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
/* écran */
.scr{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.scr .in2{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.scr .tp{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.scr .tp span{font-size:16px;font-weight:650}
.scr .tp button{width:40px;height:40px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.scr .tp button svg{width:18px;height:18px}
/* respiration */
.br{display:grid;place-items:center;margin:26px 0 18px}
.br .c{width:220px;height:220px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;position:relative}
.br .c i{position:absolute;inset:20px;border-radius:50%;background:var(--card2);transform:scale(.55);transition:transform 4s ease-in-out}
.br .c b{position:relative;font-size:20px;font-weight:650}
.br .tm{font-size:15px;color:var(--muted);margin-top:14px;font-weight:500}
.why{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.45;text-align:center}
/* confirmation */
.ok{position:fixed;inset:0;z-index:60;display:grid;place-items:center;align-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .2s;text-align:center;padding:24px}
.ok svg{width:88px;height:88px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ok circle{stroke:var(--line)}
.ok path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .45s .1s forwards}
.ok b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ok small{font-size:15px;color:var(--muted);max-width:280px;line-height:1.4}
.ok.out{opacity:0;transition:opacity .3s}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}
.ios{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:15px;line-height:1.5}
.ios ol{margin:8px 0 0;padding-left:20px}
/* parcours */
#app{padding:0;max-width:none}
.story{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px))}
.segs{display:flex;gap:4px;height:3px;margin-top:4px}.segs i{flex:1;border-radius:2px;background:var(--card2)}.segs i.f{background:var(--ink);opacity:.35}.segs i.on{opacity:1}
.stage{flex:1;display:grid;place-items:center;text-align:center;cursor:pointer;animation:fade .3s;user-select:none;-webkit-user-select:none}
.num small{display:block;font-size:15px;color:var(--muted);font-weight:500;letter-spacing:.01em}
.num strong{display:block;font-size:96px;font-weight:700;letter-spacing:-.06em;line-height:1;margin:10px 0 18px}
.hint{font-size:14px;color:var(--muted);font-weight:500}
.card>div,.end>div{max-width:340px}
.cib{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 22px}.cib svg{width:26px;height:26px}
.card h1,.end h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:0 0 12px}
.card p,.end p{font-size:16px;color:var(--muted);line-height:1.45;margin:0}
.end svg.ck{width:84px;height:84px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:20px}.end svg.ck circle{stroke:var(--line)}.end svg.ck path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .1s forwards}
.dock{display:grid;gap:10px}
.dock .row{display:flex;justify-content:center;gap:28px}
.rnd{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.rnd svg{width:58px;height:58px;padding:17px;border-radius:29px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
#stout svg{background:none;border-color:transparent}
.cacts{display:grid;gap:10px}.cacts.three{grid-template-columns:repeat(3,1fr)}
.ca{height:58px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:650}
.ca.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skip{height:40px;font-size:14px;color:var(--muted);font-weight:600}
.tout{text-align:center;padding:10px 0 24px}.tout small{display:block;font-size:13px;color:var(--muted);font-weight:500}.tout b{display:block;font-size:40px;letter-spacing:-.04em;margin:4px 0 10px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-weight:600}.lnk svg{width:16px;height:16px}
#sub .top{margin-top:0}
.foot2{display:flex;justify-content:center;gap:26px;margin:30px 0 10px}
</style>
</head>

  for(const x of S.inc)if(!x.nb&&x.t>b.ts)v+=x.v;

  ${S.imp&&S.imp.on?`<div class="sec"><h2>Imprévus</h2></div><button class="li list" id="imp" style="border-radius:20px"><span class="ib">${ic('safe')}</span><span class="t">Réserve imprévus<small>Mise de côté sur ton compte, pas comptée dans « pour aujourd’hui »</small></span><span class="r">${eur0(impV())}</span></button>`:''}
  <div class="sec"><h2>Derniers mouvements</h2></div>
  <div class="list">${mv.length?mv.map(x=>`<button class="li" data-mv="${x.k}:${x.id}"><span class="ib">${ic(x.k==='i'?'in':(CN[x.c]||CN.autre)[1])}</span><span class="t">${esc(x.k==='i'?x.n:(CN[x.c]||CN.autre)[2]+(x.p?' · '+x.p:''))}<small>${dLab(x.d).replace(/^./,c=>c.toUpperCase())}</small></span><span class="r ${x.k==='i'?'':'m'}">${x.k==='i'?'+':'−'}${eur(x.v)}</span></button>`).join(''):'<div class="empty">Rien pour l’instant.</div>'}</div>`;
  $('#dnew').onclick=()=>{buzz();flowDebt()};$('#fxnew').onclick=()=>{buzz();flowFx()};if($('#imp'))$('#imp').onclick=()=>{buzz();flowImp()};
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{buzz();person(G[+b.dataset.g])});
  document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{buzz();const x=S.fx.find(y=>y.id===b.dataset.fx);flow([{k:'x',q:esc(x.n),sub:eur(x.v)+' le '+x.d+' du mois',type:'tiles',opts:[{i:'trash',l:'Je ne l’ai plus',s:'On le retire',one:1,go:()=>{S.fx=S.fx.filter(y=>y!==x);closeFl(1);done('Retiré',x.n)}}]}],()=>null)});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{buzz();const[k,id]=b.dataset.mv.split(':'),A=k==='i'?S.inc:S.e,x=A.find(y=>y.id===id);flow([{k:'x',q:(k==='i'?'+':'−')+eur(x.v),sub:dLab(x.d).replace(/^./,c=>c.toUpperCase()),type:'tiles',opts:[{i:'trash',l:'Supprimer',s:'Une erreur de saisie',one:1,go:()=>{A.splice(A.indexOf(x),1);closeFl(1);done('Supprimé','')}}]}],()=>null)})}
function flowFx(){track('fx');flow([{k:'n',q:'C’est quoi ?',type:'text',ph:'Ex. forfait, Spotify, assurance'},{k:'v',q:'Combien ?',type:'amount'},{k:'d',q:'Prélevé quel jour du mois ?',type:'tiles',opts:[1,5,8,10,12,15,20,25,28,30].map(d=>({v:d,i:'cal',l:'Le '+d}))}],v=>{S.fx.push({id:uid(),n:v.n,v:v.v,d:v.d});return['Ajouté',v.n+' · '+eur(v.v)+' le '+v.d]})}
function flowImp(){flow([{k:'x',q:'Réserve imprévus',sub:'Elle reste sur ton compte. Base la retire juste de « pour aujourd’hui », pour un pépin : une amende, un téléphone cassé…',type:'tiles',opts:[
  {i:'plus',l:'Ajouter',one:1,go:()=>flow([{k:'v',q:'Combien tu mets de côté ?',type:'amount'}],r=>{S.imp.v=r2((S.imp.v||0)+r.v);return['Mis de côté','Ta réserve : '+eur(S.imp.v),1]})},
  ...(impV()>0?[{i:'out',l:'J’en ai eu besoin',s:'C’est fait pour ça',one:1,go:()=>flow([{k:'v',q:'Combien tu reprends ?',type:'amount'}],r=>{S.imp.v=r2(Math.max(0,S.imp.v-r.v));return['C’est fait pour ça','Il reste '+eur(S.imp.v)]})}]:[])]}],()=>null)}

/* ---------- Onglet Moi ---------- */
function moi(){const T=S.tab,lab=['Tout ok','1 à 3','4+'];
  const days=Array.from({length:7},(_,i)=>addD(today,i-6)),noted=Object.keys(S.tab.log).length+Object.keys(S.rien||{}).length;
  let tab='';
  if(T.on&&T.k.length){tab=`<div class="sec"><h2>Fumer moins</h2><button id="tset">Régler</button></div>
   ${T.k.map(k=>{const tr=tabTrend(k);return `<div class="big2" style="margin-bottom:10px"><small>${TK[k]}</small><strong>${tabDays(k)} jour${tabDays(k)>1?'s':''} sans</strong><span>${tr==='moins'?'Moins que la semaine d’avant.':tr==='plus'?'Semaine plus chargée. Ça arrive, on continue.':tr==='pareil'?'Comme la semaine d’avant.':'Depuis le début. Ce chiffre ne redescend jamais.'}</span>
   <div class="wk7">${days.map(d=>{const x=T.log[d],v=x&&x[k]!=null?x[k]:null;return `<i class="${v===0?'z':''}" style="height:${v==null?6:v===0?40:v===1?22:12}px" title="${dLab(d)}"></i>`}).join('')}</div><div class="wk7l">${days.map(d=>`<span>${'DLMMJVS'[pd(d).getDay()]}</span>`).join('')}</div></div>`}).join('')}
   <div class="grid3"><div><b>${S.crav.filter(c=>c.ok).length}</b><small>envies passées</small></div><div><b>${S.crav.length}</b><small>fois « J’ai envie »</small></div><div><b>${Object.keys(T.log).length}</b><small>jours notés</small></div></div>
   <button class="envie" id="env" style="margin-top:12px">${ic('wind')}J’ai envie de fumer</button>
   <button class="envie" id="cons">${ic('pen')}Noter une journée</button>`}
  else tab=`<div class="sec"><h2>Fumer moins</h2></div><div class="ctx" style="margin-top:0"><div class="h"><span class="ib">${ic('leaf')}</span><span><b>Tu veux réduire ? C’est toi qui décides.</b><span>Un bouton pour passer une envie, une fourchette par jour, et un compteur qui ne retombe jamais à zéro. Personne d’autre ne voit rien.</span></span></div><div class="acts"><button class="chip p" id="ton">Activer</button></div></div>`;
  OUT().innerHTML=`<div class="top"><span><small>Réglages et aide</small><b>${esc(S.name)}</b></span></div>
  <div class="sec"><h2>Réglages</h2></div>
  <div class="list">
   ${T.on&&T.k.length?`<button class="li" id="tset"><span class="ib">${ic('leaf')}</span><span class="t">Fumer moins<small>${T.k.map(k=>TK[k]).join(' et ')} · changer ou arrêter</small></span><span class="r m">${ic('next')}</span></button>`:''}
   <button class="li" id="nt"><span class="ib">${ic('bell')}</span><span class="t">Point du soir<small>${pushOn()?'Une notif par jour à '+S.nh.replace(':','h'):'Désactivé'}</small></span><span class="r m">${pushOn()?'Changer':'Activer'}</span></button>
   <button class="li" id="im"><span class="ib">${ic('safe')}</span><span class="t">Réserve imprévus<small>${S.imp&&S.imp.on?'Activée':'Pour un pépin, en option'}</small></span><span class="r m">${S.imp&&S.imp.on?'Retirer':'Activer'}</span></button>
   <button class="li" id="sn"><span class="ib">${ic('spark')}</span><span class="t">Sons des réussites<small>Seulement quand tu réussis quelque chose</small></span><span class="r m">${S.snd===0?'Coupés':'Activés'}</span></button>
   <button class="li" id="bk"><span class="ib">${ic('folder')}</span><span class="t">Sauvegarder mes données<small>${S.bk?'Dernière : '+dLab(S.bk):'Jamais'} · un fichier rien qu’à toi</small></span><span class="r m">${ic('next')}</span></button>
   <button class="li" id="rs"><span class="ib">${ic('undo')}</span><span class="t">Récupérer une sauvegarde</span><span class="r m">${ic('next')}</span></button>
   <button class="li" id="nm"><span class="ib">${ic('user')}</span><span class="t">Mon prénom</span><span class="r m">${esc(S.name)}</span></button>
   <button class="li" id="del"><span class="ib">${ic('trash')}</span><span class="t">Tout effacer</span><span class="r m">${ic('next')}</span></button>
  </div>
  <div class="sec"><h2>Parler à quelqu’un</h2></div>
  <div class="list">
   <a class="li" href="tel:3989" style="color:inherit;text-decoration:none"><span class="ib">${ic('phone')}</span><span class="t">Tabac Info Service<small>39 89 · gratuit, des tabacologues</small></span><span class="r m">${ic('next')}</span></a>
   <a class="li" href="tel:0800231313" style="color:inherit;text-decoration:none"><span class="ib">${ic('phone')}</span><span class="t">Drogues Info Service<small>0 800 23 13 13 · gratuit et anonyme</small></span><span class="r m">${ic('next')}</span></a>
   <a class="li" href="https://www.drogues-info-service.fr/Adresses-utiles" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="ib">${ic('users')}</span><span class="t">Consultation Jeunes Consommateurs<small>Gratuite, anonyme, près de chez toi</small></span><span class="r m">${ic('next')}</span></a>
   <a class="li" href="https://www.mesquestionsdargent.fr/budget/point-conseil-budget" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="ib">${ic('bank')}</span><span class="t">Point conseil budget<small>Un conseiller gratuit pour ton argent</small></span><span class="r m">${ic('next')}</span></a>
  </div>
  <p class="note">Ce que tu notes reste dans ce téléphone. Seuls les textes des rappels du soir passent par un petit serveur pour t’être envoyés, rien d’autre. Personne ne voit tes dépenses ni ta conso.</p>`;
  const on=(id,f)=>{const b=$('#'+id);if(b)b.onclick=()=>{buzz();f()}};
  on('bil',bilan);on('ton',tabOn);on('tset',tabOn);on('env',envie);on('cons',()=>flow([{k:'d',q:'Quel jour ?',type:'tiles',opts:[0,1,2,3,4,5,6].map(i=>{const d=addD(today,-i);return{v:d,i:'cal',l:dLab(d).replace(/^./,c=>c.toUpperCase())}})},{k:'r',q:'Combien ?',sub:'Une fourchette suffit.',type:'tiles',opts:RG.map(r=>({v:r.v,i:r.v?'leaf':'check',l:r.l}))}],v=>{conso(v.d,v.r,1);return null}));
  on('nt',()=>pushOn()?flow([{k:'h',q:'À quelle heure ?',sub:'Une seule notif par jour. Si tu n’ouvres plus Base pendant 3 jours, elle se tait.',type:'time'}],v=>{S.nh=v.h;return['C’est noté','Ton point du soir à '+S.nh.replace(':','h')]}):pushEnable());
  on('im',()=>{if(S.imp&&S.imp.on){S.imp.on=0;done('Retirée','La réserve revient dans « pour aujourd’hui ».')}else{S.imp={on:1,v:(S.imp&&S.imp.v)||0};flowImp()}});
  on('sn',()=>{S.snd=S.snd===0?1:0;save();render()});on('bk',backup);on('rs',restore);
  on('nm',()=>flow([{k:'n',q:'Ton prénom ?',type:'text',ph:'Prénom'}],v=>{S.name=v.n;return['C’est noté','']}));
  on('del',()=>flow([{k:'x',q:'Tout effacer ?',sub:'Tes dépenses, dettes et ta conso seront supprimées de ce téléphone.',type:'tiles',opts:[{i:'trash',l:'Oui, tout effacer',one:1,go:async()=>{try{if(S.pid)await fetch(PUSH+'/unsub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:S.pid})})}catch(e){}localStorage.removeItem(K);location.reload()}},{i:'back',l:'Non, garder',one:1,go:()=>closeFl()}]}],()=>null))}

/* ---------- Tabac ---------- */
function tabOn(){flow([
  {k:'k',q:'Tu veux suivre quoi ?',sub:'Tu peux changer quand tu veux.',type:'tiles',opts:[{v:['tabac'],i:'smoke',l:'Les clopes'},{v:['cannabis'],i:'leaf',l:'Les joints'},{v:['tabac','cannabis'],i:'split',l:'Les deux',one:1},...(S.tab.on?[{v:[],i:'x',l:'Plus rien',s:'On cache tout',one:1}]:[])]},
  {k:'why',q:'Pourquoi tu veux réduire ?',sub:'En une phrase, pour toi. Base te la montrera quand t’auras envie.',type:'text',ph:'Ex. respirer au foot, garder des sous',opt:1,skip:v=>!(v.k&&v.k.length)}
 ],v=>{S.tab.k=v.k;S.tab.on=v.k.length?1:0;if(v.why)S.tab.why=v.why;if(!S.tab.st)S.tab.st=today;return v.k.length?['C’est parti','Le bouton « J’ai envie » est sur l’accueil.']:['Caché','Tu pourras le réactiver ici.']})}
function conso(d,r,show){track('conso');const o=S.tab.log[d]||{};for(const k of S.tab.k)o[k]=r;S.tab.log[d]=o;
  /* même réaction quel que soit le chiffre */done('Noté',dLab(d).replace(/^./,c=>c.toUpperCase())+'. Merci d’être honnête avec toi.')}
let BT=null;
function envie(){track('envie');const t0=now(),DUR=180;let ph=0;
  const x=scr('Ça va passer',`<p class="qs" style="color:var(--muted);text-align:center;margin:0 0 6px;font-size:15px">Une envie dure en général quelques minutes. Respire avec le cercle.</p>
   <div class="br"><div class="c"><i id="bi"></i><b id="bt">Inspire</b></div><div class="tm" id="tm">3:00</div></div>
   ${S.tab.why?`<div class="why">« ${esc(S.tab.why)} »</div>`:''}
   <div class="two" style="margin-top:18px"><button class="bb" id="ok">${ic('check')}C’est passé</button><button class="bb alt" id="ko">J’ai fumé</button></div>`);
  const bi=x.querySelector('#bi'),bt=x.querySelector('#bt'),tm=x.querySelector('#tm');
  const step=()=>{ph=1-ph;bi.style.transitionDuration=(ph?4:6)+'s';bi.style.transform=ph?'scale(1)':'scale(.55)';bt.textContent=ph?'Inspire':'Expire';if(ph)buzz(6)};
  step();let nx=now()+4000;clearInterval(BT);BT=setInterval(()=>{const el=Math.floor((now()-t0)/1000),r=Math.max(0,DUR-el);tm.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(now()>=nx){step();nx=now()+(ph?4000:6000)}if(!r){clearInterval(BT);tm.textContent='Bravo, t’as tenu 3 minutes.'}},250);
  const end=ok=>{clearInterval(BT);S.crav.push({d:today,t:now(),ok:ok?1:0});const s=$('.scr');if(s)s.remove();ok?done('Envie passée','Chaque envie traversée compte.',1):done('Noté','Ça arrive. Ça n’efface rien de ce que t’as fait.')};
  x.querySelector('#ok').onclick=()=>end(1);x.querySelector('#ko').onclick=()=>end(0)}

/* ---------- Ton mois : 4 semaines glissantes, sans tribunal ---------- */
function bilan(){track('bilan');const from=addD(today,-27),inR=x=>x.d>=from&&x.d<=today;
  const sp=S.e.filter(x=>inR(x)&&x.c!=='dette').reduce((a,x)=>a+x.v,0),rb=S.e.filter(x=>inR(x)&&x.c==='dette').reduce((a,x)=>a+x.v,0);
  const nd=Array.from({length:28},(_,i)=>addD(from,i)).filter(d=>S.e.some(x=>x.d===d)||S.inc.some(x=>x.d===d)||(S.rien||{})[d]||S.tab.log[d]).length;
  const cats={};for(const x of S.e.filter(x=>inR(x)&&x.c!=='dette'))cats[x.c]=(cats[x.c]||0)+x.v;const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const W=[];if(rb>0)W.push(eur0(rb)+' remboursés à des gens');if(nd>=10)W.push(nd+' jours notés sur 28');const ok=S.crav.filter(c=>c.ok&&c.d>=from).length;if(ok)W.push(ok+' envie'+(ok>1?'s':'')+' passée'+(ok>1?'s':'')+' sans fumer');
  for(const k of S.tab.on?S.tab.k:[]){const n=Object.entries(S.tab.log).filter(([d,x])=>d>=from&&x[k]===0).length;if(n)W.push(n+' jour'+(n>1?'s':'')+' sans '+(k==='tabac'?'clope':'joint'))}
  const ws=wkMon(addD(today,-1)),nw=Math.min(4,Math.max(1,Math.ceil(((pd(today)-pd(S.start||today))/864e5+1)/7)));
  const x=scr('Ton mois',`<div class="big2"><small>4 dernières semaines</small><strong>${eur0(sp/nw)}</strong><span>dépensés par semaine, en moyenne${nw<4?' (depuis que tu as commencé)':''}</span></div>
   ${top.length?`<div class="sec"><h2>Où est parti l’argent</h2></div><div class="list">${top.map(([c,v])=>`<div class="li"><span class="ib">${ic((CN[c]||CN.autre)[1])}</span><span class="t">${(CN[c]||CN.autre)[2]}</span><span class="r">${eur0(v)}</span></div>`).join('')}</div>`:''}
   <div class="sec"><h2>Ce qui a marché</h2></div>
   <div class="list">${W.length?W.map(w=>`<div class="li"><span class="ib" style="background:var(--good);color:#fff">${ic('check')}</span><span class="t">${esc(w)}</span><span></span></div>`).join(''):'<div class="empty">Le mois commence. Ce qui marche apparaîtra ici.</div>'}</div>
   <div class="sec"><h2>Qu’est-ce qui t’a aidé ?</h2></div>
   <div class="tiles">${['Noter chaque soir','Voir mon chiffre du jour','Le bouton « J’ai envie »','Rien de spécial'].map((l,i)=>`<button class="tile one" data-h="${i}" style="${S.aide[ws]===l?'border-color:var(--ink)':''}"><span class="ib">${ic(i===3?'dots':'check')}</span><span><b>${esc(l)}</b></span></button>`).join('')}</div>`);
  x.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.aide[ws]=b.querySelector('b').textContent;const s=$('.scr');if(s)s.remove();done('Merci','Garde ça en tête la semaine prochaine.')});
  if(W.length)setTimeout(win,300)}

/* ---------- Sauvegarde ---------- */
function backup(){try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='base-sauvegarde-'+today+'.json';document.body.appendChild(a);a.click();a.remove();S.bk=today;done('Sauvegardé','Garde ce fichier dans Fichiers ou iCloud.')}catch(e){done('Oups','La sauvegarde n’a pas marché.')}}
function restore(){const i=document.createElement('input');i.type='file';i.accept='application/json,.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d||!d.bal)throw 0;S=d;save();done('Récupéré','Tout est revenu.')}catch(e){done('Oups','Ce fichier n’est pas une sauvegarde de Base.')}};i.click()}

/* ---------- Premier lancement ---------- */
function iosScr(){scr('Notifications',`<div class="ios"><b>Une étape avant</b><p style="margin:6px 0 0">Sur iPhone, les notifications marchent seulement quand Base est sur ton écran d’accueil :</p><ol><li>Ouvre ce lien dans Safari</li><li>Touche Partager <span aria-hidden="true">⬆︎</span></li><li>Puis « Sur l’écran d’accueil »</li></ol><p style="margin:8px 0 0">Ouvre Base depuis l’icône, et active le point du soir dans Moi.</p></div>`)}
function onboard(){flow([
  {k:'x',q:'Base, un outil à toi.',sub:'Il te dit combien tu peux dépenser aujourd’hui, et t’aide à souffler. Personne d’autre ne voit ce que tu notes. Pas de bonne ou de mauvaise réponse.',type:'tiles',opts:[{i:'next',l:'On y va',one:1,go:()=>next()}]},
  {k:'name',q:'Ton prénom ?',type:'text',ph:'Prénom'},
  {k:'bal',q:'Combien t’as sur ton compte, là ?',sub:'Ouvre ton appli de banque et recopie le chiffre. Si tu te trompes, tu recaleras en un tap.',type:'amount',zero:1,cta:'C’est ça'},
  {k:'fx',q:'Des prélèvements chaque mois ?',sub:'Forfait, abonnements… Base les retirera tout seul de ton chiffre du jour.',type:'tiles',opts:[{v:1,i:'plus',l:'Oui, j’en ajoute un'},{v:0,i:'later',l:'Plus tard'}]}
 ],v=>{S.name=v.name;S.bal={v:v.bal,d:today,ts:now()};S.start=today;S.lo=today;save();if(v.fx)setTimeout(flowFx,50);return['C’est prêt','Ton chiffre du jour t’attend.',1]})}

/* ---------- Démarrage ---------- */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=iso(new Date());if(t!==today||S.lo!==t){S.lo=t;save()}if(!FL&&!$('.scr'))render()}});
if(S.name)S.lo=today;save();render();
/* ---------- Mise à jour automatique : l’app vérifie à chaque ouverture s’il y a une nouvelle version ---------- */
const BUILD=+document.documentElement.dataset.build||0;let updT=0;
async function checkUpd(){if(Date.now()-updT<30000)return;updT=Date.now();try{const r=await fetch(location.pathname+'?b='+Date.now(),{cache:'no-store'});const t=await r.text(),m=t.match(/data-build="(\d+)"/);
  if(m&&+m[1]>BUILD&&!FL){location.replace(location.pathname+'?v='+m[1])}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpd()});setTimeout(checkUpd,800);

</script>
