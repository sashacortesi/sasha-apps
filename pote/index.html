  while(true){const d=S.log[iso(x)];if(d&&d[k]===0){n++;x.setDate(x.getDate()-1)}else break}return n}

function startEx(id){const E=EX.find(e=>e[0]===id),steps=E[6],tot=steps.reduce((a,s)=>a+s[2],0);let i=0,left=steps[0][2],el=0,pause=false;
  const x=scr(esc(E[1]),`<div class="exbar"><i id="eB" style="width:0"></i></div><div class="orbw"><div class="orb mid" id="eO"></div><div class="orbt"><b id="eC"></b></div></div><div class="exs" id="eS"></div><div class="exn" id="eN"></div><div class="two"><button class="ghost2" id="eP">Pause</button><button class="ghost2" id="eK">Passer</button></div>`);
  const L={in:'Inspire',out:'Expire',hold:'Bloque'};
  const show=()=>{const [m,t,d]=steps[i],o=x.querySelector('#eO');o.style.transitionDuration=(m==='t'?.6:d)+'s';o.classList.remove('big','mid');o.classList.add(m==='in'||m==='hold'?'big':m==='t'?'mid':'x');x.querySelector('#eS').textContent=t;const nx=steps[i+1];x.querySelector('#eN').textContent=nx&&nx[0]==='t'?'Ensuite : '+nx[1]:'';tick()};
  const tick=()=>{const [m]=steps[i];x.querySelector('#eC').textContent=(m==='t'?'':L[m]+' · ')+left;x.querySelector('#eB').style.width=(el/tot*100)+'%'};
  const end=()=>{clearInterval(eT);S.ex[id]=(S.ex[id]||0)+1;closeScr();done(['Exercice terminé','Si l’envie revient, recommence'])};
  show();clearInterval(eT);eT=setInterval(()=>{if(pause)return;left--;el++;if(left<=0){i++;if(i>=steps.length)return end();left=steps[i][2];buzz(12);show()}else tick()},1000);
  x.querySelector('#eP').onclick=e=>{pause=!pause;e.target.textContent=pause?'Reprendre':'Pause'};
  x.querySelector('#eK').onclick=()=>{el+=left;i++;if(i>=steps.length)return end();left=steps[i][2];show()}}

function helpScr(){const sm=!!S.vice,norm=t=>(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/<[^>]+>/g,'');
  const A={dep:flowDep,inc:flowInc,hist:histScr,bal:flowBal,prog:progScr,ag:()=>{agD=today;agScr('day')},agnew:()=>flowAg(),debts:debtList,debtnew:flowDebt,cof:cofScr,wk:()=>wkScr(wkStart()),set:settings,push:pushEnable,backup:()=>backup(),sos:openSOS,ex:exList,smoked:flowSmoked,gains:gainsScr,fume:fumeScr,vset:flowVice,
    fx:()=>flow([{k:'fx',q:'Tes charges fixes',sub:'Ajoute, renomme ou supprime ce que tu paies chaque mois.',type:'fixes'}],v=>{fxSave(v.fx);return['Enregistré',eur0(S.fixe)+' par mois']}),
    rin:()=>flow([{...RIN_STEP,q:'Ce qui rentre chaque mois'}],v=>{rinSave(v.rin);return['Enregistré',rinSub()]})};
  const G=HELP.map(([g,l])=>[g,l.filter(e=>!e[5]||(e[5]==='v'?sm:!sm))]).filter(g=>g[1].length);
  const x=scr('Aide',`<div class="hs"><input id="hS" type="search" placeholder="Ta question… (ex. salaire, dette, heure)" autocomplete="off"></div><div id="hL"></div>`);
  const L=x.querySelector('#hL');
  const row=(e,id)=>`<div class="hq" data-h="${id}"><button type="button"><span>${e[0]}</span><i></i></button><div class="ha"><p>${e[1]}</p>${e[3]&&A[e[3]]?`<button type="button" class="hgo" data-go="${e[3]}">${e[2]} ›</button>`:''}</div></div>`;
  const draw=q=>{const n=norm(q).trim().split(/\s+/).filter(Boolean);let h='',c=0;
    G.forEach(([g,l],gi)=>{const m=l.map((e,i)=>[e,gi+'-'+i]).filter(([e])=>!n.length||n.every(w=>norm(e[0]+' '+e[1]+' '+e[4]+' '+g).includes(w)));if(!m.length)return;c+=m.length;h+=`<div class="hg">${g}</div>`+m.map(([e,id])=>row(e,id)).join('')});
    L.innerHTML=c?h:`<div class="hnone">Pas trouvé avec ces mots.<br>Essaie plus simple : « dépense », « salaire », « dette », « heure ».</div>`;
    L.style.display='grid';L.style.gap='8px';
    if(n.length&&c<=3)L.querySelectorAll('.hq').forEach(d=>d.classList.add('on'));
    L.querySelectorAll('.hq>button').forEach(b=>b.onclick=()=>{buzz();const d=b.parentNode,on=!d.classList.contains('on');L.querySelectorAll('.hq.on').forEach(z=>z.classList.remove('on'));if(on){d.classList.add('on');setTimeout(()=>{const r=d.getBoundingClientRect();if(r.bottom>innerHeight-20)x.scrollBy({top:r.bottom-innerHeight+40,behavior:'smooth'})},60)}});
    L.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{buzz();const f=A[b.dataset.go];closeScr();f()})};
  draw('');const si=x.querySelector('#hS');si.oninput=()=>draw(si.value)}

function onbApply(v){S.name=v.n;fxSave(v.fx);rinSave(v.rin||[]);accSave(v.acc);S.start=today;S.vice=v.vice;if(v.vice){S.wk=v.wk;S.vstart=today}}
function onboard(){const N=v=>esc(v.n||'');flow([
  {k:'n',q:'Comment tu t’appelles ?',sub:'Juste ton prénom.',type:'text',ph:'Ton prénom'},
  {k:'fx',q:v=>`Enchanté ${N(v)}. Qu’est-ce qui sort de ton compte chaque mois ?`,sub:'Forfait, abonnements, assurance… Seulement ce que tu as. Le jour du prélèvement, si tu le connais.',type:'fixes'},
  {...RIN_STEP,q:v=>'Et qu’est-ce qui rentre chaque mois ?'},
  {k:'acc',q:v=>`Et là, tu as combien sur tes comptes, ${N(v)} ?`,sub:'Une ligne par compte, l’app fait le total.',type:'accounts'},
  {k:'vice',q:'Tu fumes ?',sub:'Pour voir ce que ça te coûte, et ce que tu gardes les jours sans.',type:'tiles',opts:[{v:'c',i:'smoke',l:'Des clopes'},{v:'j',i:'leaf',l:'Des joints'},{v:'cj',i:'spark',l:'Les deux',one:1},{v:'',i:'ban',l:'Je ne fume pas',one:1}]},
  {k:'wk',q:'Ça te coûte combien par semaine, à peu près ?',sub:'À peu près, ça suffit.',type:'amount',skip:v=>!v.vice},
  {k:'nt',q:v=>`Dernière chose, ${N(v)} : je te préviens quand il faut ?`,sub:()=>'La veille d’un prélèvement, et le soir pour noter ta journée.'+(needInstall()?'<br><br>Sur iPhone, les rappels marchent dans l’app installée sur ton écran d’accueil. Tu trouveras comment faire sur l’accueil.':''),type:'tiles',opts:[...(needInstall()?[{i:'check',l:'OK',one:1,v:0}]:[{i:'bell',l:'Oui, préviens-moi',one:1,go:v=>{onbApply(v);save();pushEnable()}},{i:'later',l:'Plus tard',one:1,v:0}])]}
 ],v=>{onbApply(v);return['C’est prêt, '+v.n,S.bal?eur(S.bal.v)+' sur tes comptes · '+eur0(upSum())+' à payer'+(inSum()?' · '+eur0(inSum())+' à recevoir':'')+' ce mois':'']})}

function intro(){const L=[['Chaque mois, l’argent file.',''],['Sans trop savoir où.','g'],['Les clopes, les petits achats,','g'],['les prélèvements qu’on oublie.','g'],['À partir d’aujourd’hui,',''],['tu sais.','b']];
  const o=document.createElement('div');o.id='intro';o.innerHTML=`<div class="glow"></div>${L.map(([t,c])=>`<div class="ln ${c}">${t}</div>`).join('')}<div class="fin"><div class="bar"></div><div class="logo">Base</div><div class="tg">Ton argent, ta conso, tes journées.<br>Tout au même endroit, toujours à jour.</div></div><button class="st">Commencer</button><button class="sk">Passer</button>`;
  o.insertAdjacentHTML('beforeend','<div class="tap"><span class="pd"></span><small>Touche l’écran</small></div>');o.querySelector('.sk').style.display='none';
  document.body.appendChild(o);const ls=[...o.querySelectorAll('.ln')];let ts=[],ended=false,started=false;
  const fin=()=>{if(ended)return;ended=true;ts.forEach(clearTimeout);ls.forEach(l=>l.style.display='none');o.classList.add('lit');o.querySelector('.fin').classList.add('on');o.querySelector('.sk').style.display='none';buzz([6,60,10]);setTimeout(()=>sfx('logo'),350)};
  const go=()=>{if(started)return;started=true;ac();padStart();const tp=o.querySelector('.tap');tp.classList.add('out');setTimeout(()=>tp.remove(),500);o.querySelector('.sk').style.display='';
    ls.forEach((l,i)=>ts.push(setTimeout(()=>{l.classList.add('on');sfx('l'+i);if(i===4)o.classList.add('lit')},500+i*1250)));
    ts.push(setTimeout(fin,500+ls.length*1250+200))};
  o.querySelector('.sk').onclick=e=>{e.stopPropagation();fin()};
  o.onclick=e=>{if(e.target.closest('.st'))return;if(!started)go();else fin()};
  o.querySelector('.st').onclick=e=>{e.stopPropagation();buzz();padStop();o.style.transition='opacity .5s';o.style.opacity='0';setTimeout(()=>o.remove(),500);onboard()}}
function countUp(){const el=$('#balc strong');if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const L=liveBal();if(L==null)return;const t0=performance.now(),D=900;
  const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=eur(Math.round(L*e*100)/100);if(k<1)requestAnimationFrame(f);else el.textContent=eur(L)};requestAnimationFrame(f)}
home();try{tPrev=S.name?tasks().length:0}catch(e){}if(needInstall())instGate();else if(!S.name)intro();else{countUp();0}

<script>
(()=>{const mark=document.documentElement.getAttribute('data-build');if(!mark)return;let busy=0;
const chk=()=>{if(busy||!navigator.onLine)return;busy=1;fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{busy=0;const m=t.match(/data-build="([^"]+)"/);
  if(!m||+m[1]<=+mark)return;const k='upd:'+m[1];try{const l=+sessionStorage.getItem(k)||0;if(Date.now()-l<20e3)return;sessionStorage.setItem(k,Date.now())}catch(e){}
  location.replace(location.pathname+'?v='+m[1]+'&t='+Date.now()+location.hash)}).catch(()=>{busy=0})};
chk();setInterval(()=>{if(document.visibilityState==='visible')chk()},45e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});
addEventListener('pageshow',chk);addEventListener('focus',chk);addEventListener('online',chk);})();

<script>
