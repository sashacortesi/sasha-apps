  const X=i=>4+i*(w-8)/(pts.length-1),Y=v=>h-6-(v-mn)/r*(h-14);const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return `<svg class="spk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--good)" stop-opacity=".25"/><stop offset="1" stop-color="var(--good)" stop-opacity="0"/></linearGradient></defs><path class="a" d="${d} L${X(pts.length-1)} ${h} L${X(0)} ${h}Z"/><path class="l" d="${d}"/><circle cx="${X(pts.length-1)}" cy="${Y(vs.at(-1))}" r="3.5"/></svg>`}

  const tick=()=>{const [m]=steps[i];x.querySelector('#eC').textContent=(m==='t'?'':L[m]+' · ')+left;x.querySelector('#eB').style.width=(el/tot*100)+'%'};
  const end=()=>{clearInterval(eT);S.ex[id]=(S.ex[id]||0)+1;closeScr();done(['Exercice terminé','Si l’envie revient, recommence'])};
  show();clearInterval(eT);eT=setInterval(()=>{if(pause)return;left--;el++;if(left<=0){i++;if(i>=steps.length)return end();left=steps[i][2];buzz(12);show()}else tick()},1000);
  x.querySelector('#eP').onclick=e=>{pause=!pause;e.target.textContent=pause?'Reprendre':'Pause'};
  x.querySelector('#eK').onclick=()=>{el+=left;i++;if(i>=steps.length)return end();left=steps[i][2];show()}}

/* ---------- Ce que tu gagnes ---------- */
let gC='corps';
function gainsScr(){const G=GAINS.map(([k,n,l])=>[k,n,l.filter(it=>!it[2]||has(it[2]))]);
  const nn=it=>it[2]?streak(it[2]):best();const all=G.flatMap(g=>g[2]),got=all.filter(it=>nn(it)>=it[0]).length;
  const g=G.find(x=>x[0]===gC);let nx=false;
  const wl=d=>d<7?d+' jour'+(d>1?'s':''):d<30?(d/7)+' semaine'+(d>7?'s':''):d<365?(d/30)+' mois':'1 an';
  const x=scr('Ce que tu gagnes',`<div class="gsum"><b>${got} / ${all.length}</b><span>${got?'bienfaits débloqués. Chaque jour sans fumer en ajoute.':'Le premier arrive après 1 jour sans fumer.'}</span></div>
   <div class="st3">${keys().map(k=>`<div><b>${streak(k)} j</b><small>${KN[k]}</small></div>`).join('')}<div><b>${eur0(saved())}</b><small>économisés</small></div></div>
   <div class="chips">${G.map(([k,n])=>`<button class="chip" data-gc="${k}" aria-pressed="${k===gC}">${n}</button>`).join('')}</div>
   <div class="rc" style="padding:2px 16px">${g[2].map(it=>{const [d,t,ky]=it,n=nn(it),ok=n>=d;let c=ok?'dn':'';if(!ok&&!nx){c='next';nx=true}
     return `<div class="ms ${c}"><span class="mk">${ok?ic('check'):''}</span><span><span class="when">${wl(d)}${ky?' '+KN[ky]:''}${c==='next'?' · encore '+(d-n)+' j':''}</span><b>${t}</b></span></div>`}).join('')}</div>`);
  x.querySelectorAll('[data-gc]').forEach(b=>b.onclick=()=>{gC=b.dataset.gc;buzz();gainsScr()})}

/* ---------- Réglages ---------- */
function settings(){flow([{k:'x',q:'Réglages',type:'tiles',opts:[
  {i:'home',l:'Mes charges fixes',s:fxSub(),one:1,go:()=>flow([{k:'fx',q:'Tes charges fixes',sub:'Ajoute, renomme ou supprime ce que tu paies chaque mois.',type:'fixes'}],v=>{fxSave(v.fx);return['Enregistré',eur0(S.fixe)+' par mois']})},
  {i:'bank',l:'Mon solde',s:S.bal?eur(liveBal())+' · mis à jour le '+pd(S.bal.d).getDate()+' '+MN[pd(S.bal.d).getMonth()]:'Pas encore renseigné',one:1,go:()=>flowBal()},
  {i:'in',l:'Mes revenus réguliers',s:rinSub(),one:1,go:()=>flow([{...RIN_STEP,q:'Ce qui rentre chaque mois'}],v=>{rinSave(v.rin);return['Enregistré',rinSub()]})},
  {i:'folder',l:'Sauvegarder mes données',s:S.bk?'Dernière le '+pd(S.bk).getDate()+' '+MN[pd(S.bk).getMonth()]:'Au cas où tu changes de téléphone',one:1,go:()=>backup()},
  {i:'undo',l:'Restaurer une sauvegarde',s:'Depuis un fichier',one:1,go:()=>restore()},
  {i:'bell',l:'Notifications',s:pushOn()?'Activées':'Désactivées',one:1,go:()=>pushOn()?pushOff():pushEnable()},
  {i:'user',l:'Mon prénom',s:S.name||'',one:1,go:()=>flow([{k:'n',q:'Ton prénom ?',type:'text',ph:'Prénom'}],v=>{S.name=v.n;return['Enregistré',v.n]})},
  {i:'smoke',l:'Ma conso',s:S.vice?({c:'Clopes',j:'Joints',cj:'Clopes et joints'}[S.vice]+(S.wk?' · '+eur0(S.wk)+' par semaine avant':'')):'Pas suivie',one:1,go:()=>flowVice()},
  {i:'trash',l:'Tout effacer',s:'Repartir de zéro',one:1,go:()=>flow([{k:'x',q:'Tout effacer ?',sub:'Tes dépenses, dettes et ton agenda seront supprimés.',type:'tiles',opts:[{i:'trash',l:'Oui, tout effacer',one:1,go:()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()}},{i:'undo',l:'Non, garder',one:1,go:()=>closeFl()}]}],()=>['',''])},
  {i:'undo',l:'Retour',one:1,go:()=>closeFl()}]}],()=>['',''])}

/* ---------- Premier lancement ---------- */
function onbApply(v){S.name=v.n;fxSave(v.fx);rinSave(v.rin||[]);accSave(v.acc);S.start=today;S.vice=v.vice;if(v.vice){S.wk=v.wk;S.vstart=today}}
function onboard(){const N=v=>esc(v.n||'');flow([
  {k:'n',q:'Comment tu t’appelles ?',sub:'Juste ton prénom.',type:'text',ph:'Ton prénom'},
  {k:'fx',q:v=>`Enchanté ${N(v)}. Qu’est-ce qui sort de ton compte chaque mois ?`,sub:'Forfait, abonnements, assurance… Seulement ce que tu as. Le jour du prélèvement, si tu le connais.',type:'fixes'},
  {...RIN_STEP,q:v=>'Et qu’est-ce qui rentre chaque mois ?'},
  {k:'acc',q:v=>`Et là, tu as combien sur tes comptes, ${N(v)} ?`,sub:'Une ligne par compte, l’app fait le total.',type:'accounts'},
  {k:'vice',q:'Tu fumes ?',sub:'Pour voir ce que ça te coûte, et ce que tu gardes les jours sans.',type:'tiles',opts:[{v:'c',i:'smoke',l:'Des clopes'},{v:'j',i:'leaf',l:'Des joints'},{v:'cj',i:'spark',l:'Les deux',one:1},{v:'',i:'ban',l:'Je ne fume pas',one:1}]},
  {k:'wk',q:'Ça te coûte combien par semaine, à peu près ?',sub:'À peu près, ça suffit.',type:'amount',skip:v=>!v.vice},
  {k:'nt',q:v=>`Dernière chose, ${N(v)} : je te préviens quand il faut ?`,sub:()=>'La veille d’un prélèvement, et le soir pour noter ta journée.'+(needInstall()?'<br><br>Sur iPhone, les rappels marchent dans l’app installée sur ton écran d’accueil. Tu trouveras comment faire sur l’accueil.':''),type:'tiles',opts:[...(needInstall()?[{i:'check',l:'OK',one:1,v:0}]:[{i:'bell',l:'Oui, préviens-moi',one:1,go:v=>{onbApply(v);save();pushEnable()}},{i:'later',l:'Plus tard',one:1,v:0}])]}
 ],v=>{onbApply(v);return['C’est prêt, '+v.n,S.bal?eur(S.bal.v)+' sur tes comptes · '+eur0(upSum())+' à payer'+(inSum()?' · '+eur0(inSum())+' à recevoir':'')+' ce mois':'']})}

function intro(){const L=[['Chaque mois, l’argent file.',''],['Sans trop savoir où.','g'],['Les clopes, les petits achats,','g'],['les prélèvements qu’on oublie.','g'],['À partir d’aujourd’hui,',''],['tu sais.','b']];
  const o=document.createElement('div');o.id='intro';o.innerHTML=`<div class="glow"></div>${L.map(([t,c])=>`<div class="ln ${c}">${t}</div>`).join('')}<div class="fin"><div class="bar"></div><div class="logo">Libre</div><div class="tg">Ton argent, ta conso, tes journées.<br>Tout au même endroit, toujours à jour.</div></div><button class="st">Commencer</button><button class="sk">Passer</button>`;
  document.body.appendChild(o);const ls=[...o.querySelectorAll('.ln')];let ts=[],ended=false;
  const fin=()=>{if(ended)return;ended=true;ts.forEach(clearTimeout);ls.forEach(l=>l.style.display='none');o.classList.add('lit');o.querySelector('.fin').classList.add('on');o.querySelector('.sk').style.display='none';buzz([6,60,10])};
  ls.forEach((l,i)=>ts.push(setTimeout(()=>{l.classList.add('on');if(i===4)o.classList.add('lit')},300+i*1250)));
  ts.push(setTimeout(fin,300+ls.length*1250+200));
  o.querySelector('.sk').onclick=e=>{e.stopPropagation();fin()};
  o.onclick=e=>{if(!e.target.closest('.st'))fin()};
  o.querySelector('.st').onclick=e=>{e.stopPropagation();buzz();o.style.transition='opacity .5s';o.style.opacity='0';setTimeout(()=>o.remove(),500);onboard()}}
function countUp(){const el=$('#balc strong');if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const L=liveBal();if(L==null)return;const t0=performance.now(),D=900;
  const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=eur(Math.round(L*e*100)/100);if(k<1)requestAnimationFrame(f);else el.textContent=eur(L)};requestAnimationFrame(f)}
home();try{tPrev=S.name?tasks().length:0}catch(e){}if(needInstall())instGate();else if(!S.name)intro();else{countUp();setTimeout(showTodo,900)}
</script>
<script>
(()=>{const mark=document.documentElement.getAttribute('data-build');if(!mark)return;
const chk=()=>fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=t.match(/data-build="([^"]+)"/);
  if(m&&m[1]!==mark){let k='upd:'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,1)}catch(e){}{const q=new URLSearchParams(location.search);q.set('v',m[1]);location.replace(location.pathname+'?'+q+location.hash)}}}).catch(()=>{});
chk();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()});})();
</script>
