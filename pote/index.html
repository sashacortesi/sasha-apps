.h2[data-a]{cursor:pointer}.howc{font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
.sh2.why{display:grid;gap:12px;max-height:88vh;overflow-y:auto}.why h3{margin:2px 0 0;font-size:20px}.why h4{margin:8px 0 0;font-size:15px;color:var(--muted);font-weight:600}
.wcalc,.wev{background:var(--card2);border-radius:16px;padding:4px 14px}.wr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;font-size:15px}.wr+.wr{border-top:.5px solid var(--sep)}
.wr span{display:grid}.wr small{font-size:12.5px;color:var(--muted);font-weight:500}.wr b{font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== Brique joker ===== */
.jki{width:26px;height:16px;flex:0 0 auto}.jki rect{fill:#FF9F0A}.jki path{fill:#fff}.jki.off rect{fill:none;stroke:#8E8E93;stroke-width:2;stroke-dasharray:4 3}.jki.off path{fill:#8E8E93}
.jkl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:60;max-width:488px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#2C2C2E;color:#fff;font-size:14.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:okin .3s ease-out;transition:opacity .4s}.toast.out{opacity:0}

/* ===== Corrections AG ===== */
.big strong.neg,.big .aft b.neg,.li .r.neg,.hero strong.neg,.neg,.solr b.neg{color:#FF9F0A}
.house{height:200px}.h2 .cap{width:70%;display:grid;gap:6px;justify-items:center;margin-top:14px}.h2 .cap span{font-size:13px;font-weight:600;color:var(--good)}.h2 .cap small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}.h2 .cap .pb{width:100%;margin:0}

/* ===== Récap du jour ===== */
#rcp{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 70% at 50% 0%,#1C1C1E 0%,#000 65%);display:grid;grid-template-rows:auto 1fr auto auto;padding:calc(34px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;animation:okin .3s ease-out;transition:transform .32s cubic-bezier(.3,.7,.3,1),opacity .32s}
#rcp.up{transform:translateY(-100%);opacity:0}
.rch h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em}.rch p{margin:6px 0 0;font-size:15px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rcs{display:inline-flex;align-items:center;gap:4px;color:#FF9F0A;font-weight:700}.rcs svg{width:16px;height:16px;fill:#FF9F0A;stroke:none}
.rcf{display:flex;align-items:baseline;gap:8px;margin-top:14px}.rcf small{font-size:14px;color:var(--muted);font-weight:600}.rcf b{font-family:var(--num);font-size:28px;font-weight:700}
.rbs{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:14px 12px;padding:20px 0}
.rb{--bc:#8E8E93;position:relative;width:var(--z);height:var(--z);border-radius:50%;border:0;padding:8px;display:grid;align-content:center;justify-items:center;gap:2px;text-align:center;font:inherit;color:var(--bc);background:color-mix(in srgb,var(--bc) 20%,#000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bc) 35%,transparent);animation:rpop .38s cubic-bezier(.3,1.5,.5,1) var(--d) both,rflo var(--t) ease-in-out var(--o) infinite}
.rb b{font-size:13px;font-weight:700;line-height:1.15;color:#fff;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.rb small{font-family:var(--num);font-size:12px;font-weight:700;color:var(--bc)}
.rb[style*="96px"] b{font-size:14px}.rb[style*="74px"] b{font-size:11.5px}.rb[data-more] b{font-size:15px}
.rb.tap{transform:scale(.92)}.rb .rdot{position:absolute;top:8px;right:12px;width:8px;height:8px;border-radius:50%;background:#FF453A}
.c-ag{--bc:#0A84FF}.c-mo{--bc:#FF9F0A}.c-ev{--bc:#5E5CE6}.c-dt{--bc:#BF5AF2}.c-wi{--bc:#FF6FB5}.c-bi{--bc:#30D158}.c-gr{--bc:#8E8E93}.c-ok{--bc:#30D158}
.rb.big b{font-size:17px}.rb.gone{animation:rgone .45s ease-in .35s both}.rb.gone svg{width:30px;height:30px;color:#30D158}
@keyframes rpop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes rflo{0%,100%{translate:0 0}50%{translate:var(--fx,2px) calc(var(--fy,4px) * -1)}}
@keyframes rgone{to{transform:scale(.6);opacity:0}}
#rcp.rm .rb{animation:okin .2s ease-out both}
.rce{text-align:center;color:var(--muted);font-size:15px;margin:0 0 10px}
.rcin{height:56px;border:0;border-radius:16px;background:#fff;color:#000;font:inherit;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}.rcin svg{width:18px;height:18px;transform:rotate(90deg)}

/* ===== Thèmes : clair (par défaut) et nuit ===== */
:root{--hsg:rgba(255,255,255,.16)}
:root[data-theme="light"]{--bg:#F2F2F7;--card:#FFFFFF;--card2:#E9E9EE;--ink:#000000;--muted:#6C6C70;--line:#E5E5EA;--sep:rgba(60,60,67,.16);--good:#1FA34A;--bad:#FF3B30;--hsg:rgba(0,0,0,.16);

[data-theme="light"] .nud,[data-theme="light"] .tile,[data-theme="light"] .mm,[data-theme="light"] .solr,[data-theme="light"] .lvc,[data-theme="light"] .vic div,[data-theme="light"] .goal,[data-theme="light"] .list,[data-theme="light"] .mrow2,[data-theme="light"] .wish,[data-theme="light"] .tipb{box-shadow:0 1px 2px rgba(0,0,0,.04)}

/* ===== Bulles façon verre (inspiré d'Apple, à notre façon) ===== */
.rbi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:3px}.rbi svg{width:15px;height:15px;stroke-width:2;color:#fff}

.rb.big .rbi{width:40px;height:40px}.rb.big .rbi svg{width:22px;height:22px}
#rcp .rbs{position:relative}
#rcp::before,#rcp::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;z-index:-1}
#rcp::before{background:#0A84FF;top:28%;left:-90px;animation:aur 14s ease-in-out infinite alternate}#rcp::after{background:#BF5AF2;top:45%;right:-110px;animation:aur 17s ease-in-out infinite alternate-reverse}

#rcp{isolation:isolate;overflow:hidden}

#rcp.rm::before,#rcp.rm::after{animation:none}
.rb,.bub:not(.add){--g:var(--bc,var(--pc));color:var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--g) 10%,rgba(255,255,255,.72)),color-mix(in srgb,var(--g) 16%,rgba(255,255,255,.5)));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -1px 0 color-mix(in srgb,var(--g) 25%,transparent),0 10px 30px -14px color-mix(in srgb,var(--g) 55%,transparent),0 1px 3px rgba(0,0,0,.06)}
.bub:not(.add){--g:var(--pc)}
[data-theme="dark"] .rb,[data-theme="dark"] .bub:not(.add){background:linear-gradient(180deg,color-mix(in srgb,var(--g) 22%,rgba(255,255,255,.10)),color-mix(in srgb,var(--g) 14%,rgba(255,255,255,.04)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.08),0 10px 30px -14px color-mix(in srgb,var(--g) 60%,transparent)}
.rb b,.bub:not(.add) b{color:var(--ink);text-shadow:none;font-weight:650}
.rb small,.bub:not(.add) .bt{color:var(--g);font-family:var(--num);font-weight:700}
.rbi{background:var(--g);box-shadow:0 3px 8px -3px color-mix(in srgb,var(--g) 80%,transparent)}.rbi svg{color:#fff}
.c-gr{--bc:#8E8E93}

#rcp::before{background:#5AC8FA}#rcp::after{background:#BF5AF2}
[data-theme="light"] #rcp::before,[data-theme="light"] #rcp::after{opacity:.30}
.bubs{position:relative;isolation:isolate}
.bubs::before{content:"";position:absolute;inset:-10px -20px;background:radial-gradient(40% 50% at 20% 40%,color-mix(in srgb,#5AC8FA 22%,transparent),transparent 70%),radial-gradient(40% 50% at 80% 60%,color-mix(in srgb,#BF5AF2 18%,transparent),transparent 70%);filter:blur(20px);z-index:-1;pointer-events:none}

/* ===== Fondations (retour au vert) ===== */
.gauge{width:100%;min-width:0;display:grid;gap:12px;padding:14px 16px 12px;border:0;border-radius:22px;background:var(--card);font:inherit;color:var(--ink);text-align:left;margin:4px 0;box-shadow:0 10px 30px -18px rgba(255,159,10,.55)}
.gl1{display:flex;align-items:center;gap:8px;min-width:0}.glv{font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF9F0A,#FF375F);padding:4px 8px;border-radius:9px;white-space:nowrap;letter-spacing:.02em}
.gl1 b{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gl1 em{font-style:normal;font-size:13px;font-weight:700;color:#FF9F0A;white-space:nowrap}

.gmid{position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;margin-left:-1px;border-radius:1px;background:color-mix(in srgb,var(--good) 60%,transparent)}
.gfl{position:absolute;left:0;top:0;bottom:0;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#FF6B3D,#FF9F0A 30%,#FFD60A 48%,#5FD37E 55%,#30D158);background-size:calc(10000% / var(--w,100)) 100%;transition:width 1.4s cubic-bezier(.22,1,.36,1);box-shadow:0 0 14px -2px rgba(255,159,10,.7)}

@keyframes gsh{to{background-position:28px 0}}
.gnd{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--muted);box-shadow:0 0 0 2px var(--card2),0 2px 6px rgba(0,0,0,.08);z-index:1;transition:transform .3s}
.gnd svg{width:13px;height:13px;stroke-width:2.4}.gnd small{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}.gnd.on small,.gnd.nx small{color:var(--ink)}
.gnd.k-g{width:30px;height:30px;margin:-15px 0 0 -15px;color:var(--good);box-shadow:0 0 0 2.5px var(--good),0 2px 8px rgba(48,209,88,.25)}.gnd.k-g small{top:34px;color:var(--good)}
.gnd.on{background:#FF9F0A;color:#fff;box-shadow:0 0 0 2px var(--card),0 3px 10px -2px rgba(255,159,10,.7)}.gnd.on.k-g,.gnd.on.k-b{background:var(--good);box-shadow:0 0 0 2px var(--card),0 3px 10px -2px rgba(48,209,88,.7)}.gnd.on.k-o,.gnd.on.k-c{background:var(--c-cof)}
.gnd.nx{color:#FF9F0A;box-shadow:0 0 0 2.5px #FF9F0A;animation:gnx 1.6s ease-in-out infinite}.gnd.nx.k-g{color:var(--good);box-shadow:0 0 0 2.5px var(--good)}
@keyframes gnx{50%{transform:scale(1.15)}}
.gnd.pop{animation:gpop .7s cubic-bezier(.3,1.6,.5,1)}@keyframes gpop{0%{transform:scale(.5)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.gl2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:500}.gl2 b{color:var(--ink);font-weight:700}
.vgp{width:100%;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 16px;border:0;border-radius:20px;font:inherit;text-align:left;color:var(--ink);margin-top:-6px;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.55));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(0,0,0,.04),0 8px 24px -14px rgba(31,163,74,.6)}
[data-theme="dark"] .vgp{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px -14px rgba(48,209,88,.5)}
.vgb{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.vgb i{height:10px;border-radius:3px;background:var(--card2)}.vgb i.on{background:linear-gradient(180deg,#5FD37E,var(--good))}

.vgm{display:grid;justify-items:end;text-align:right;padding:6px 10px;border-radius:12px;background:var(--card2)}.vgm small{font-size:11px;color:var(--muted);font-weight:700}.vgm b{font-size:14px;font-family:var(--num)}.vgm em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
.vgm.ok{background:color-mix(in srgb,var(--good) 16%,var(--card))}.vgm.ok b{color:var(--good);filter:brightness(.85)}
[data-theme="light"] .vgp{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 24px -16px rgba(31,163,74,.45)}
.fdn{position:relative;width:180px;margin:6px auto 0;display:grid;justify-items:center}.fdn .grass{width:220px;height:10px;border-radius:5px;background:linear-gradient(90deg,#8BD17C,var(--good))}

.strk.vgw{background:radial-gradient(circle at 50% 35%,#1E6B3A,#000 72%)}.strk.vgw b{font-size:28px;text-align:center}.strk.vgw small{text-align:center;max-width:300px}.strk.vgw .fdn{margin-bottom:18px}.strk.vgw .hole{background:rgba(255,255,255,.08)}

/* sélection multiple */
.tile.mt{position:relative}.tile.mt .mk{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--sep);color:transparent}.tile.mt .mk svg{width:14px;height:14px;stroke-width:2.4}

  background:radial-gradient(120% 90% at 0% 0%,#2E9D57 0%,transparent 55%),linear-gradient(160deg,#1E7A43,#0E3F24);box-shadow:0 14px 30px -16px rgba(31,163,74,.8)}
.chh{display:grid;gap:4px}.chb{justify-self:start;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18)}.chh b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.chc .vgb i{background:rgba(255,255,255,.18)}.chc .vgb i.on{background:linear-gradient(180deg,#FFD66B,#FF9F0A)}
.chg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chg div{display:grid;padding:10px;border-radius:14px;background:rgba(255,255,255,.12)}.chg b{font-family:var(--num);font-size:20px}.chg small{font-size:12px;opacity:.8;font-weight:600}

.qlist{display:grid;gap:8px}.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--card)}
.qic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:14px;color:#FF9500;background:color-mix(in srgb,#FF9500 14%,var(--card))}.qic svg{width:18px;height:18px;stroke-width:2.4}
.qrow.qdone .qic{background:var(--good);color:#fff}.qtx{display:grid;gap:7px}.qtx b{font-size:15px}.qtx i{display:block;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}.qtx em{display:block;height:100%;background:linear-gradient(90deg,#FFB340,#FF9500);border-radius:3px}

  for(let v=-Math.floor((W-1)/step)*step;v<0;v+=step)P.push({v,k:'p'});
  const NM=[['Premier pas','leaf'],['Ça remonte','flame'],['Presque','spark'],['Dernière ligne','zap']],np=P.length;
  P.forEach((x,i)=>{const j=np<=3?[0,1,2].slice(3-np)[i]:Math.min(3,i);x.l=NM[j][0];x.i=NM[j][1]});
  P.push({v:0,l:'Vert',k:'g',i:'check'});const g=S.cof&&S.cof.g,bv=Math.max(50,niceStep(step/2));

const MNs=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const dShort=d=>{const x=pd(d);return x.getDate()+' '+MNs[x.getMonth()]};
function lifeCaps(){const L=[],st=mon(S.start||today),end=addD(today,7*60),add=(d,t,i,id)=>{if(d&&d>=st&&d<=end)L.push({d,t,i,id})};
  const y=+today.slice(0,4);for(const yy of [y,y+1]){add(yy+'-01-01','Nouvel an','spark');add(yy+'-07-01','L’été','sun');add(yy+'-09-01','La rentrée','brief')}
  const ym=today.slice(0,7);let k=0;for(const x of S.rin||[])if(x.d)for(let m=0;m<3;m++){const Y=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+m,1),YM2=Y.getFullYear()+'-'+String(Y.getMonth()+1).padStart(2,'0'),d=fxDate(x,YM2);if(d>today&&k<4){add(d,x.n||'Revenu','in');k++}}
  const V=vgState();if(V&&V.def>0){const r=nextRin();if(r&&r.dt)add(r.dt,'Retour au vert','check')}
  const g=S.cof&&S.cof.g;if(g){const cv=cofV(),pm=cofPlan(),t=esc(g.n)+(cv>=g.v?' · atteint':' · '+Math.round(cv/g.v*100)+' %');let d=g.d||'';if(!d&&cv<g.v){if(pm>0){const x=pd(today);x.setMonth(x.getMonth()+Math.ceil((g.v-cv)/pm));d=iso(x)}else if(S.cof.w>0)d=addD(today,Math.ceil((g.v-cv)/S.cof.w)*7)}if(cv>=g.v){let acc=cv;d=today;for(const e of (S.cof.h||[]).slice().reverse()){if(acc-e.v<g.v){d=e.d;break}acc-=e.v}}if(d)add(d<st?today:d,t,'gift','goal')}
  for(const m of S.ms||[])add(m.d,esc(m.t),'flame',m.id);
  return L}
function fRow(f,n,big){return `<div class="frow${f.scaf?' scaf':''}${f.cur?' fcur':''}"${f.cur?' id="fcur"':''}>${big?`<span class="fno">${n}</span>`:''}${f.days.map((s,k)=>`<i class="fw ${s}${f.cur&&addD(f.w,k)===today&&(s==='on'||s==='gd')?' now':''}"></i>`).join('')}${big?`<span class="fno r">${f.scaf?'⚠︎':''}</span>`:''}</div>`}
function towerFlat(lim){const F=towerFloors(),N=F.length,show=lim&&N>lim?F.slice(-lim):F,V=vgState(),red=V&&V.def>0,big=lim===0;
  const st=mon(S.start||today),fl=d=>Math.floor((pd(mon(d))-pd(st))/6048e5+.5)+1,C={};if(big)for(const c of lifeCaps())(C[fl(c.d)]=C[fl(c.d)]||[]).push(c);
  const cap=n=>(C[n]||[]).sort((a,b)=>b.d.localeCompare(a.d)).map(c=>`<div class="fms${c.d<today?' past':''}${c.id?' own':''}"${c.id?` data-ms="${c.id}"`:''}>${ic(c.i)}<b>${c.t}</b><small>${dShort(c.d)}</small></div>`).join('');
  let ghost='';if(big){const G=[52,104,208,520].find(x=>x>N)||N+52;for(let n=G;n>N;n--)ghost+=cap(n)+`<div class="frow gh">${n===G||n%10===0||C[n]?`<span class="fno">${n}</span>`:'<span class="fno"></span>'}${'<i class="fw"></i>'.repeat(7)}<span class="fno r"></span></div>`;ghost=`<div class="fgoal">Sommet visé · étage ${G}${G===52?' · 1 an':''}</div>`+ghost}
  const rows=show.slice().reverse().map((f,i)=>cap(N-i)+fRow(f,N-i,big)).join('');
  return `<div class="ftw${big?' big':''}"><div class="ffac">${ghost}${rows}</div>${lim&&N>lim?`<small class="fmore">+ ${N-lim} étage${N-lim>1?'s':''}</small>`:''}<div class="fgnd"></div>
   ${big?`<small class="flab">Fondations · semaine du ${(()=>{const d=pd(F[0].w);return d.getDate()+' '+['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][d.getMonth()]})()}</small>`:''}${red?`<div class="fbase">${[...Array(10)].map((_,i)=>`<i class="${i<V.br?'on':''}"></i>`).join('')}</div><small class="flab">Niveau vert · ${V.br}/10</small>`:''}</div>`}

function startEx(id){const E=EX.find(e=>e[0]===id),steps=E[6],tot=steps.reduce((a,s)=>a+s[2],0);let i=0,left=steps[0][2],el=0,pause=false;
  const x=scr(esc(E[1]),`<div class="exbar"><i id="eB" style="width:0"></i></div><div class="orbw"><div class="orb mid" id="eO"></div><div class="orbt"><b id="eC"></b></div></div><div class="exs" id="eS"></div><div class="exn" id="eN"></div><div class="two"><button class="ghost2" id="eP">Pause</button><button class="ghost2" id="eK">Passer</button></div>`);
  const L={in:'Inspire',out:'Expire',hold:'Bloque'};
  const show=()=>{const [m,t,d]=steps[i],o=x.querySelector('#eO');o.style.transitionDuration=(m==='t'?.6:d)+'s';o.classList.remove('big','mid');o.classList.add(m==='in'||m==='hold'?'big':m==='t'?'mid':'x');x.querySelector('#eS').textContent=t;const nx=steps[i+1];x.querySelector('#eN').textContent=nx&&nx[0]==='t'?'Ensuite : '+nx[1]:'';tick()};
  const tick=()=>{const [m]=steps[i];x.querySelector('#eC').textContent=(m==='t'?'':L[m]+' · ')+left;x.querySelector('#eB').style.width=(el/tot*100)+'%'};
  const end=()=>{clearInterval(eT);S.ex[id]=(S.ex[id]||0)+1;closeScr();done(['Exercice terminé','Si l’envie revient, recommence'])};
  show();clearInterval(eT);eT=setInterval(()=>{if(pause)return;left--;el++;if(left<=0){i++;if(i>=steps.length)return end();left=steps[i][2];buzz(12);show()}else tick()},1000);

function gainsScr(){const G=GAINS.map(([k,n,l])=>[k,n,l.filter(it=>!it[2]||has(it[2]))]);
  const nn=it=>it[2]?streak(it[2]):best();const all=G.flatMap(g=>g[2]),got=all.filter(it=>nn(it)>=it[0]).length;
  const g=G.find(x=>x[0]===gC);let nx=false;
  const wl=d=>d<7?d+' jour'+(d>1?'s':''):d<30?(d/7)+' semaine'+(d>7?'s':''):d<365?(d/30)+' mois':'1 an';
  const x=scr('Ce que tu gagnes',`<div class="gsum"><b>${got} / ${all.length}</b><span>${got?'bienfaits débloqués. Chaque jour sans fumer en ajoute.':'Le premier arrive après 1 jour sans fumer.'}</span></div>

   <div class="chips">${G.map(([k,n])=>`<button class="chip" data-gc="${k}" aria-pressed="${k===gC}">${n}</button>`).join('')}</div>
   <div class="rc" style="padding:2px 16px">${g[2].map(it=>{const [d,t,ky]=it,n=nn(it),ok=n>=d;let c=ok?'dn':'';if(!ok&&!nx){c='next';nx=true}
     return `<div class="ms ${c}"><span class="mk">${ok?ic('check'):''}</span><span><span class="when">${wl(d)}${ky?' '+KN[ky]:''}${c==='next'?' · encore '+(d-n)+' j':''}</span><b>${t}</b></span></div>`}).join('')}</div>`);
