.ring span{width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:700}

.feed{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.m{background:var(--card);border-radius:22px;overflow:hidden;border:1px solid var(--line)}
.art{position:relative;height:96px;background:var(--c);color:var(--on);display:flex;align-items:flex-end;padding:12px 16px}

.slot{position:relative;font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.04em}
.chk{position:absolute;right:12px;bottom:10px;width:40px;height:40px;border-radius:50%;border:2px solid var(--on);background:transparent;color:var(--on);display:grid;place-items:center;font-size:18px;line-height:1}
.chk[aria-pressed="true"]{background:var(--on);color:var(--c)}
.body{padding:14px 16px 6px}
.body h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}

.chip{padding:5px 10px;border-radius:99px;background:var(--bg);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
details{padding:4px 16px 14px}
summary{cursor:pointer;list-style:none;font-weight:700;font-size:14px;padding:10px 0;color:var(--mute)}

.ing{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}

.how{margin:12px 0 0;font-size:15px;line-height:1.5}
.m.done .body h3{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}

swaps.forEach(function(x){ doSwap(x[0],x[1],x[2]); });
function addSwap(a,b,i){ doSwap(a,b,i); swaps.push([a,b,i]); try { localStorage.setItem("menu-swaps", JSON.stringify(swaps)); } catch(e) {} }
function resetSwaps(){ for(var n = swaps.length - 1; n >= 0; n--) doSwap(swaps[n][0],swaps[n][1],swaps[n][2]); swaps = []; try { localStorage.removeItem("menu-swaps"); } catch(e) {} }
var swapOpen = -1;
function k(d,i){ return d + ":" + i; }
function tot(d){ var a = 0, p = 0, e = 0, n = 0; D[d].forEach(function(m,i){ a += m[2]; p += m[3]; if(eaten[k(d,i)]){ e += m[2]; n++; } }); return {kcal:a, prot:p, eaten:e, n:n}; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function renderDays(){
  var box = document.getElementById("days"); box.innerHTML = "";
  DS.forEach(function(n,i){
    var t = tot(i), b = document.createElement("button");
    b.className = "d"; b.setAttribute("role","tab"); b.setAttribute("aria-selected", i === di);
    b.innerHTML = '<div class="ring" style="--p:' + (t.n / D[i].length * 100) + '"><span>' + n + '</span></div><small>' + t.kcal + '</small>';
    b.onclick = function(){ di = i; view = "j"; render(); window.scrollTo(0,0); };
    box.appendChild(b);
  });
}
function renderDay(){
  var t = tot(di);
  document.getElementById("dn").textContent = DN[di];
  document.getElementById("kc").innerHTML = '<b>' + t.eaten + '</b> sur ' + t.kcal + ' kcal · ' + t.prot + ' g de protéines au total';
  document.getElementById("pb").style.width = (t.kcal ? t.eaten / t.kcal * 100 : 0) + "%";
  var feed = document.getElementById("feed"); feed.innerHTML = "";
  D[di].forEach(function(m,i){
    var c = CL[m[0]], on = !!eaten[k(di,i)];
    var a = document.createElement("article");
    a.className = "m s-" + c + (on ? " done" : "");
    a.innerHTML = '<div class="art">' + ART[c] + '<span class="slot">' + esc(m[0]) + '</span><button class="chk" aria-pressed="' + on + '" aria-label="Marquer comme mangé">' + (on ? "✓" : "") + '</button></div>' +
      '<div class="body"><h3>' + esc(m[1]) + '</h3><div class="chips"><span class="chip">' + m[2] + ' kcal</span><span class="chip">' + m[3] + ' g protéines</span></div></div>' +
      '<button class="swb" data-i="' + i + '">⇄ Changer de jour</button>' + (swapOpen === i ? '<div class="swl">' + D.map(function(dd,j){ return j === di ? '' : '<button data-j="' + j + '"><b>' + DN[j] + '</b><span>' + esc(dd[i][1]) + '</span></button>'; }).join("") + '<p>Les deux repas s’échangent. Les courses restent identiques.</p></div>' : '') + '<details><summary>Recette</summary><ul class="ing">' + m[4].map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul><p class="how">' + esc(m[5]) + '</p></details>';
    a.querySelector(".chk").onclick = function(){ if(eaten[k(di,i)]) delete eaten[k(di,i)]; else eaten[k(di,i)] = 1; save(); render(); };
    a.querySelector(".swb").onclick = function(){ swapOpen = swapOpen === i ? -1 : i; render(); };
    Array.prototype.forEach.call(a.querySelectorAll(".swl button"), function(b){
      b.onclick = function(){ addSwap(di, +b.getAttribute("data-j"), i); swapOpen = -1; render(); };
    });
    feed.appendChild(a);
  });
  if(swaps.length){ var r = document.createElement("button"); r.className = "swr"; r.textContent = "Remettre le menu d’origine"; r.onclick = function(){ resetSwaps(); render(); }; feed.appendChild(r); }
}
function renderWeek(){
  var w = document.getElementById("week"); w.innerHTML = "";
  var today = (new Date().getDay() + 6) % 7;
  D.forEach(function(d,i){
    var b = document.createElement("button"); b.className = "wd" + (i === today ? " today" : "");
    b.innerHTML = '<header><h2>' + DN[i] + '</h2><span>' + tot(i).kcal + ' kcal</span></header><ul>' +
      d.map(function(m){ return '<li class="s-' + CL[m[0]] + '"><i></i><span>' + esc(m[1]) + '</span></li>'; }).join("") + '</ul>';
    b.onclick = function(){ di = i; view = "j"; render(); window.scrollTo(0,0); };
    w.appendChild(b);
  });
}
var START = "j";
var FEE = 4.90, CAP = 125;
var SH = [
 ["Protéines",[["oeufs","Œufs plein air, boîte de 12 ×3",9.75],["fb","Fromage blanc 0 %, 1 kg ×4",7.84],["skyr","Skyr 0 %, 850 g",3.02],["poulet","Filets de poulet, 1 kg",11.19],["steak","Steaks hachés 5 %, 6 × 100 g",11.79],["thon","Thon au naturel, 2 boîtes ×2",9.26]]],
 ["Féculents",[["lait","Lait demi-écrémé bio, 6 L",7.26],["riz","Riz long, 1 kg",1.85],["pain","Pain complet tranché ×4",10.52],["pd","Patates douces, 1 kg ×2",4.98]]],
 ["Légumes",[["courg","Courgette, 1 kg",2.39],["brocoli","Brocoli en fleurettes, 900 g",2.15],["tomates","Tomates cerises, 250 g ×3",2.97],["butter","Butternut",2.29],["poivrons","Poivrons rouges, 500 g ×2",5.28]]],
 ["Fruits",[["avocats","Avocat Hass bio ×4",5.00],["bananes","Bananes bio, 5 fruits",1.99],["clem","Clémentines, 1 kg",4.59]]]
];
var have = {};
try { have = JSON.parse(localStorage.getItem("shop-have") || "{}") || {}; } catch(e) { have = {}; }
function saveHave(){ try { localStorage.setItem("shop-have", JSON.stringify(have)); } catch(e) {} }
function eur(n){ return n.toFixed(2).replace(".", ",") + " €"; }
var KEYS = [["pain complet","pain"],["fromage blanc","fb"],["lait","lait"],["banane","bananes"],["poulet","poulet"],["riz","riz"],["brocoli","brocoli"],["avocat","avocats"],["œuf","oeufs"],["courgette","courg"],["poivron","poivrons"],["patate douce","pd"],["thon","thon"],["tomates","tomates"],["skyr","skyr"],["steak","steak"],["butternut","butter"],["mandarine","clem"]];
function levels(){
  var tt = {}, ee = {};
  D.forEach(function(day,d){ day.forEach(function(m,i){ m[4].forEach(function(x){ var lx = x.toLowerCase();
    KEYS.forEach(function(kk){ if(lx.indexOf(kk[0]) > -1){ tt[kk[1]] = (tt[kk[1]]||0) + 1; if(eaten[k(d,i)]) ee[kk[1]] = (ee[kk[1]]||0) + 1; } }); }); }); });
  var r = {}; Object.keys(tt).forEach(function(id){ r[id] = Math.max(0, Math.round((1 - (ee[id]||0) / tt[id]) * 100)); });
  return r;
}
function renderShop(){
  var LV = levels(), low = [];
  SH.forEach(function(g){ g[1].forEach(function(it){ if(LV[it[0]] !== undefined && LV[it[0]] <= 25 && !have[it[0]]) low.push(it[1].split(",")[0]); }); });
  var t = 0;
  SH.forEach(function(g){ g[1].forEach(function(it){ if(!have[it[0]]) t += it[2]; }); });
  var all = t + FEE;
  var n = new Date(), d = n.getDay(), h = n.getHours();
  var days = (7 - d) % 7; if(days === 0 && h >= 18) days = 7;
  var urgent = days <= 1;
  var nt = days === 0 ? "Commande ce soir avant 18 h" : days === 1 ? "Commande demain avant 18 h" : "Prochaine commande dans " + days + " jours";
  var ns = days === 0 ? "Livraison lundi. Choisis ton créneau maintenant." : "Chaque dimanche, livraison le lundi. Une alerte te prévient.";
  var o = '<section class="sh-hero"><div class="sh-big">' + all.toFixed(2).replace(".", ",") + '<em>€ avec la livraison</em></div>' +
    '<div class="sh-sub">Courses ' + eur(t) + ' + livraison ' + eur(FEE) + ' · plafond ' + CAP + ' €</div>' +
    '<div class="bar' + (all > CAP ? ' over' : '') + '"><i style="width:' + Math.min(100, all / CAP * 100) + '%"></i></div>' +
    '<div class="nx fr"><b>' + (low.length ? 'À racheter bientôt (' + low.length + ')' : 'Frigo : rien d’urgent') + '</b><span>' + (low.length ? low.join(" · ") : 'Coche tes repas dans Jour, la liste suit ce que tu as mangé.') + '</span></div><div class="nx' + (urgent ? ' urgent' : '') + '"><b>' + nt + '</b><span>' + ns + '</span></div></section>';
  SH.forEach(function(g){
    o += '<div class="sh-g">' + g[0] + '</div>';
    g[1].forEach(function(it){
      o += '<button class="srow' + (have[it[0]] ? ' has' : '') + '" data-id="' + it[0] + '"><span class="dot">✓</span><span class="lb">' + it[1] + (LV[it[0]] !== undefined ? '<span class="lv' + (LV[it[0]] <= 25 ? ' lo' : '') + '"><i style="width:' + LV[it[0]] + '%"></i></span><small class="lt">reste ≈ ' + LV[it[0]] + ' %</small>' : '') + '</span><span class="pr">' + it[2].toFixed(2).replace(".", ",") + '</span></button>';
    });
  });
  o += '<button class="swr" id="nw">' + (window._nw ? 'Confirmer : tout remettre à zéro' : 'Nouvelle semaine : décocher tous les repas') + '</button><p class="note">Touche un article que tu as déjà : il est retiré du total. Prix du panier Carrefour de la semaine 1.</p>';
  var box = document.getElementById("shop");
  box.innerHTML = o;
  document.getElementById("nw").onclick = function(){ if(!window._nw){ window._nw = 1; renderShop(); return; } window._nw = 0; eaten = {}; save(); render(); };
  Array.prototype.forEach.call(box.querySelectorAll(".srow"), function(b){
    b.onclick = function(){ var id = b.getAttribute("data-id"); if(have[id]) delete have[id]; else have[id] = 1; saveHave(); renderShop(); };
  });
}
function render(){
  var j = view === "j", s2 = view === "s", c = view === "c";
  document.getElementById("day").hidden = !j;
  document.getElementById("week").hidden = !s2;
  document.getElementById("shop").hidden = !c;
  document.getElementById("days").hidden = !j;
  document.getElementById("vj").setAttribute("aria-pressed", j);
  document.getElementById("vs").setAttribute("aria-pressed", s2);
  document.getElementById("vc").setAttribute("aria-pressed", c);
  renderDays();
  if(j) renderDay(); else if(s2) renderWeek(); else renderShop();
}
document.getElementById("vj").onclick = function(){ view = "j"; render(); };
document.getElementById("vs").onclick = function(){ view = "s"; render(); };
document.getElementById("vc").onclick = function(){ view = "c"; render(); };
view = (START === "c" || location.hash === "#courses") ? "c" : "j";
render();
var BUILD = "1793718020";
function checkUpdate(){
  try {
    fetch(location.pathname + "?c=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(t){
      var m = t.match(/var BUILD = "(\d+)"/);
      if(m && m[1] !== BUILD){ location.replace(location.pathname + "?v=" + m[1]); }
    }).catch(function(){});
  } catch(e) {}
}
checkUpdate();
document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkUpdate(); });
</script>
</body></html>
