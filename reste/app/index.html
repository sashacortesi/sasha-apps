<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<title>Reste</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--card2:#EEEEF1;--ink:#111113;--muted:#8A8A90;--line:#E7E7EB;--good:#1A9E50;--bad:#E8730C;--acc:#111113;--onacc:#fff;--shadow:0 1px 2px rgba(0,0,0,.04);
 --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;--n:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;color-scheme:light}
[data-t="dark"]{--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#F5F5F7;--muted:#8E8E93;--line:#2C2C2E;--good:#32D074;--bad:#FF9F0A;--acc:#F5F5F7;--onacc:#000;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:contain}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--n);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--good)}.neg{color:var(--bad)}
.app{max-width:500px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.top b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.ibtn .ic{width:19px;height:19px}
.hero{display:grid;justify-items:center;text-align:center;padding:26px 0 8px;gap:2px}
.hero small{font-size:15px;font-weight:600;color:var(--muted)}
.hero strong{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.05em;margin:6px 0 4px}
.hero span{font-size:15px;color:var(--muted)}
.finl{justify-self:center;display:flex;align-items:center;gap:6px;margin:10px 0 4px;padding:9px 15px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--muted)}
.finl b{font-weight:800}.finl .ic{width:13px;height:13px;opacity:.6}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 0}
.sech h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.sech button{font-size:14px;font-weight:600;color:var(--muted)}
.tl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px 4px;scroll-snap-type:x proximity}.tl::-webkit-scrollbar{display:none}
.tl button{flex:0 0 auto;display:grid;gap:1px;min-width:98px;max-width:150px;padding:11px 13px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);text-align:left;scroll-snap-align:start}
.tl small{font-size:12px;font-weight:700;color:var(--muted)}.tl b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl span{font-size:15px;font-weight:700}
.tl .empty{color:var(--muted);font-size:14px;padding:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .odd{grid-column:1/-1}
.tile{display:grid;align-content:start;gap:3px;padding:15px 16px 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:left;min-width:0}
.tile small{font-size:13px;font-weight:700;color:var(--muted)}.tile strong{font-size:25px;font-weight:800;white-space:nowrap}
.tile>span:last-child{font-size:12.5px;color:var(--muted);line-height:1.3}
.bar{display:block;height:5px;border-radius:3px;background:var(--card2);overflow:hidden;margin:5px 0 3px}.bar i{display:block;height:100%;border-radius:3px;background:var(--good)}
button:active{opacity:.6}
.fab{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
.fab .ic{width:26px;height:26px;stroke-width:2.2}
/* écrans de détail */
.scr{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;animation:in .2s ease-out}
@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.scr .in{max-width:500px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom));display:grid;gap:14px}
.sbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:44px}.sbar span{text-align:center;font-weight:700;font-size:17px}
.big{display:grid;gap:4px;padding:20px 18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.big small{font-size:14px;font-weight:600;color:var(--muted)}.big strong{font-size:44px;font-weight:800;letter-spacing:-.045em;line-height:1.05}.big span{font-size:14px;color:var(--muted)}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--ink)}.row .ri .ic{width:17px;height:17px}
.row .rt{font-size:16px;font-weight:500;min-width:0}.row .rt small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.row .rv{font-weight:700;white-space:nowrap}.row.dim .rt,.row.dim .rv{color:var(--muted)}
.lh{display:flex;justify-content:space-between;margin:6px 4px -4px;font-size:13px;font-weight:700;color:var(--muted)}
.calc .row{grid-template-columns:1fr auto 14px}.calc .row .ic{width:13px;height:13px;color:var(--muted)}
.calc .tot{font-weight:800}.calc .tot .rv{font-size:22px}
.addb{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-weight:600;text-align:left}
.foot{text-align:center;font-size:12.5px;color:var(--muted);margin:2px 0}
.empt{text-align:center;color:var(--muted);padding:18px 0}
/* feuilles (ajout / modification) */
.sh{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;animation:fd .18s}
@keyframes fd{from{opacity:0}}
.shb{width:100%;max-width:500px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .24s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.shb h3{margin:4px 0 14px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.amt{display:flex;justify-content:center;align-items:baseline;gap:6px;margin:4px 0 14px}
.amt input{width:100%;text-align:center;border:0;background:none;outline:0;font-family:var(--n);font-size:56px;font-weight:800;letter-spacing:-.04em;padding:0}
.fld{display:grid;gap:6px;margin-bottom:12px}.fld>label{font-size:13px;font-weight:700;color:var(--muted);margin-left:4px}
.fld input{width:100%;padding:14px 16px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);outline:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.chip .ic{width:15px;height:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:12px;padding:3px}
.seg button{padding:9px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.go{width:100%;padding:16px;border-radius:16px;background:var(--acc);color:var(--onacc);font-weight:700;font-size:17px;margin-top:6px}
.go:disabled{opacity:.35}
.del{width:100%;padding:14px;color:var(--bad);font-weight:600;margin-top:4px}
.pick{display:grid;gap:10px}
.pick button{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.pick .ri{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff}
.pick b{display:block;font-size:16px}.pick small{font-size:13px;color:var(--muted)}
/* calendrier */
.cal{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.calh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;font-weight:700}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calg small{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.calg button{aspect-ratio:1/1.05;border-radius:12px;display:grid;align-content:center;justify-items:center;gap:3px;font-size:15px;font-weight:600}
.calg button.o{opacity:.25}.calg button.t{background:var(--card2)}.calg button.s{background:var(--acc);color:var(--onacc)}
.calg i{display:flex;gap:2px;height:5px}.calg i b{width:5px;height:5px;border-radius:50%}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 16px;border-radius:999px;background:var(--card);box-shadow:0 6px 24px rgba(0,0,0,.14);font-size:14px;font-weight:600;white-space:nowrap;animation:tu .25s}
.toast button{display:flex;align-items:center;gap:5px;font-weight:700}.toast .ic{width:15px;height:15px}
@keyframes tu{from{opacity:0;transform:translate(-50%,10px)}}
/* accueil premier lancement */
.onb{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;max-width:500px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom))}
.onb .prog{display:flex;gap:6px}.onb .prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.onb .prog i.on{background:var(--acc)}
.onb .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.onb h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.onb p{margin:0 0 10px;color:var(--muted);font-size:16px;line-height:1.45}
.onb .skip{padding:12px;color:var(--muted);font-weight:600}
.lr{display:grid;grid-template-columns:1fr 92px 54px 30px;gap:8px;align-items:center;margin-bottom:8px}
.lr input{padding:12px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);outline:0;font-size:15px;min-width:0}
.lr .x{color:var(--muted)}.lr .x .ic{width:16px;height:16px}
.lrh{display:grid;grid-template-columns:1fr 92px 54px 30px;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 2px 6px}
.ladd{display:flex;gap:8px;align-items:center;color:var(--muted);font-weight:600;padding:8px 2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="Ajouter"></button>
<script>
/* ===== Reste : combien il te reste aujourd'hui, et ce qui arrive. Données sur le téléphone. ===== */
const K='reste:v1';
const P={plus:'<path d="M12 5v14M5 12h14"/>',next:'<path d="m9 6 6 6-6 6"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',back:'<path d="m15 6-6 6 6 6"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 cart:'<path d="M3 4h2l2.4 11h10.2L20 8H6.3"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',fork:'<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 21V3c-2 1-3 4-3 7h3"/>',burger:'<path d="M4 11a8 6 0 0 1 16 0zM4 15h16M5 15v1a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-1"/>',glass:'<path d="M7 3h10l-1 8a4 4 0 0 1-8 0zM12 15v6M8 21h8"/>',train:'<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M8 20l-2 2M16 20l2 2M9 13h.01M15 13h.01"/>',bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/>',heart:'<path d="M12 20.5s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3z"/>',play:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/>',dots:'<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>',
 out:'<path d="M12 19V5M6 11l6-6 6 6"/>',in:'<path d="M12 5v14M6 13l6 6 6-6"/>',cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',repeat:'<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',bank:'<path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',check:'<path d="m5 12 5 5 9-10"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',up2:'<path d="M12 20V8M7 13l5-5 5 5M5 4h14"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${P[k]||''}</svg>`;
const CATS=[['courses','Courses','cart','#2FB36B'],['resto','Resto','fork','#F29A2E'],['ff','Fast-food','burger','#F06A3A'],['sorties','Sorties','glass','#A35BE0'],['transport','Transport','train','#2F80ED'],['shopping','Shopping','bag','#E3559A'],['abos','Abonnements','play','#5B6CF0'],['sante','Santé','heart','#E5484D'],['autre','Autre','dots','#8A8A90']];
const CN=Object.fromEntries(CATS.map(c=>[c[0],c]));
/* dates */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d)};
const addM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return iso(d).slice(0,7)};
const ldm=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const onDay=(ym,d)=>ym+'-'+String(Math.min(d,ldm(ym))).padStart(2,'0');
let today=iso(new Date()),YM=today.slice(0,7);
const MN=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],MNL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],JN=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
const dd=k=>pd(k).getDate()+' '+MN[pd(k).getMonth()];
const dl=k=>k===today?'Aujourd’hui':k===addD(today,-1)?'Hier':k===addD(today,1)?'Demain':JN[pd(k).getDay()].replace(/^./,c=>c.toUpperCase())+' '+dd(k);
const inD=k=>{const n=Math.round((pd(k)-pd(today))/864e5);return n===0?'aujourd’hui':n===1?'demain':n>1?'dans '+n+' j':n===-1?'hier':'il y a '+(-n)+' j'};
const mnl=()=>MNL[+YM.slice(5,7)-1];
/* argent */
const r2=n=>Math.round(n*100)/100;
const eur=n=>{const r=r2(n);return r.toLocaleString('fr-FR',r%1?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0})+' €'};
const eur0=n=>Math.round(n).toLocaleString('fr-FR')+' €';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const buzz=(p=8)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
/* état */
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={};S={fx:[],rin:[],up:[],e:[],inc:[],debts:[],rok:{},env:{},...S};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
/* annuler : une photo avant chaque changement */
let UNDO=null,UT=null;
function mut(label,fn){const snap=JSON.stringify(S);fn();save();UNDO={snap,label};render();toast(label)}
function toast(label){clearTimeout(UT);const o=$('.toast');if(o)o.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(label)}</span><button>${ic('undo')}Annuler</button>`;document.body.appendChild(t);
  t.querySelector('button').onclick=()=>{if(!UNDO)return;S=JSON.parse(UNDO.snap);UNDO=null;save();t.remove();buzz([6,30,6]);render()};UT=setTimeout(()=>t.remove(),5000)}

/* ---- le calcul ---- */
const created=id=>{const t=parseInt(String(id).slice(0,-4),36);return isFinite(t)?t:0};
/* une ligne compte dans le solde si elle date d'après la mise à jour du solde */
const counts=x=>S.bal&&!x.nb&&x.d>=S.bal.d&&created(x.id)>S.bal.ts&&x.d<=today;
function fxOcc(from,to){const L=[];let ym=from.slice(0,7);for(let k=0;k<40&&ym<=to.slice(0,7);k++){for(const x of S.fx){if(!x.d)continue;const dt=onDay(ym,x.d);if(dt>from&&dt<=to)L.push({...x,dt})}ym=addM(ym,1)}return L}
function liveBal(){if(!S.bal)return null;let v=S.bal.v;
  for(const x of S.inc)if(counts(x))v+=x.v;for(const x of S.e)if(counts(x))v-=x.v;
  for(const x of fxOcc(S.bal.d,today))v-=x.v;
  for(const x of S.up)if(x.k==='out'&&x.d>S.bal.d&&x.d<=today)v-=x.v;
  return r2(v)}
const eom=()=>onDay(YM,31);
const fxLeft=()=>fxOcc(today,eom());
const upLeft=k=>S.up.filter(x=>x.k===k&&x.d>today&&x.d<=eom());
const rinKey=(x,ym)=>ym+'|'+x.id;

function fromBase(B){if(!B||!B.name)return null;const ym=iso(new Date()).slice(0,7),pk=n=>String(n||'').trim().toLowerCase(),okR=n=>!!(B.rok||{})[ym+'|'+pk(n)];

  for(const x of B.up||[])if(x.v>0&&x.d&&!(x.k==='in'&&okR(x.n)))N.up.push({id:x.id||uid(),k:x.k==='in'?'in':'out',n:x.n||'Prévu',v:r2(x.v),d:x.d});
  for(const x of B.e||[]){if(!(x.v>0)||!x.d)continue;const o={id:x.id||uid(),d:x.d,v:r2(x.v),c:BC[x.c]||'autre'};const n=x.c==='dette'?'Remboursé à '+(x.p||''):x.ap&&x.s?x.s:'';if(n)o.n=n;if(x.nb)o.nb=1;N.e.push(o)}

  for(const x of B.debts||[])if(x.v>0)N.debts.push({id:x.id||uid(),p:x.p||'?',t:x.t||'',v:r2(x.v),w:x.w==='them'?'them':'me',d:x.d||today,due:x.dd||''});

let OB={i:0,n:'',acc:[{n:'',v:null}],fx:[{n:'',v:null,d:null}],rin:[{n:'',v:null,d:null}]};
function onboard(){let o=$('.onb');if(!o){o=document.createElement('div');o.className='onb';document.body.appendChild(o)}const i=OB.i;
  const lines=(L,ph,dl)=>`<div class="lrh"><span>Nom</span><span>Montant</span><span>${dl}</span><span></span></div>${L.map((x,j)=>`<div class="lr"><input data-j="${j}" data-f="n" placeholder="${ph[j%ph.length]}" value="${esc(x.n)}"><input data-j="${j}" data-f="v" inputmode="decimal" placeholder="0 €" value="${x.v!=null?String(x.v).replace('.',','):''}"><input data-j="${j}" data-f="d" inputmode="numeric" maxlength="2" placeholder="—" value="${x.d||''}"><button class="x" data-x="${j}">${ic('x')}</button></div>`).join('')}<button class="ladd" id="la">${ic('plus')}Ajouter une ligne</button>`;
  const P=[[`Combien il te reste.<br>Vraiment.`,'Pas un relevé de banque : un chiffre par jour, et ce qui arrive. Ton prénom ?',`<button class="addb" id="fb" style="margin-bottom:6px">${ic('down')}<span>J’ai déjà Base : reprendre mes données</span></button><input class="txt" id="nm" placeholder="Prénom" value="${esc(OB.n)}" style="padding:16px;border-radius:16px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:18px;outline:0">`],
   ['Ce que tu as','Le total de tes comptes, aujourd’hui. Mets − si tu es à découvert.',`${OB.acc.map((a,j)=>`<div class="lr" style="grid-template-columns:1fr 120px 30px"><input data-j="${j}" data-f="n" placeholder="${j?'Revolut':'Ta banque'}" value="${esc(a.n)}"><input data-j="${j}" data-f="v" inputmode="decimal" placeholder="0 €" value="${a.v!=null?String(a.v).replace('.',','):''}"><button class="x" data-x="${j}">${ic('x')}</button></div>`).join('')}<button class="ladd" id="la">${ic('plus')}Un autre compte</button>`],
   ['Ce qui part chaque mois','Loyer, forfait, abonnements. Le jour du prélèvement, si tu le sais.',lines(OB.fx,['Loyer','Forfait','Spotify','Assurance'],'Le')],
   ['Ce qui rentre chaque mois','Salaire, aides… Le jour où ça tombe.',lines(OB.rin,['Salaire','CAF','Aide'],'Le')]];
  const [h,p,b]=P[i],L=[null,OB.acc,OB.fx,OB.rin][i];
  o.innerHTML=`<div class="prog">${P.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><div class="body"><h1>${h}</h1><p>${p}</p>${b}</div><button class="go" id="nx">${i<3?'Suivant':'C’est parti'}</button>${i?`<button class="skip" id="sk">${i===1?'Plus tard':'Je n’en ai pas'}</button>`:''}`;
  if(L){o.querySelectorAll('[data-j]').forEach(e=>e.oninput=()=>{const x=L[+e.dataset.j],f=e.dataset.f;if(f==='n')x.n=e.value;else if(f==='v'){const n=parseFloat(e.value.replace(/\s/g,'').replace(',','.').replace('−','-'));x.v=isNaN(n)?null:n}else{const d=parseInt(e.value,10);x.d=d>=1&&d<=31?d:null}});
    o.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{L.splice(+e.dataset.x,1);if(!L.length)L.push({n:'',v:null,d:null});onboard()});
    o.querySelector('#la').onclick=()=>{L.push({n:'',v:null,d:null});onboard();const n=o.querySelectorAll('[data-f="n"]');n[n.length-1].focus()}}
  else{const nm=o.querySelector('#nm');nm.oninput=()=>OB.n=nm.value;o.querySelector('#fb').onclick=()=>{buzz();baseSheet()};if(!baseLocal())setTimeout(()=>nm.focus(),200)}
  const fin=()=>{S.name=OB.n.trim()||'toi';const acc=OB.acc.filter(a=>a.v!=null).map(a=>({n:a.n||'Compte',v:r2(a.v)}));if(acc.length)S.bal={v:r2(sum(acc)),d:today,ts:Date.now(),acc};
    S.fx=OB.fx.filter(x=>x.v>0).map(x=>({id:uid(),n:x.n||'Charge',v:r2(x.v),...(x.d?{d:x.d}:{})}));S.rin=OB.rin.filter(x=>x.v>0).map(x=>({id:uid(),n:x.n||'Revenu',v:r2(x.v),...(x.d?{d:x.d}:{})}));
    for(const x of S.rin)if(x.d&&onDay(YM,x.d)<=today)S.rok[rinKey(x,YM)]=1;S.start=today;save();o.remove();buzz([10,40,14]);render()};
  o.querySelector('#nx').onclick=()=>{buzz();if(i===0&&!OB.n.trim())return o.querySelector('#nm').focus();if(i<3){OB.i++;onboard()}else fin()};
  const sk=o.querySelector('#sk');if(sk)sk.onclick=()=>{buzz();if(i===1)OB.acc=[{n:'',v:null}];if(i===2)OB.fx=[];if(i===3)OB.rin=[];if(i<3){OB.i++;if(OB.i===2&&!OB.fx.length)OB.fx=[{n:'',v:null,d:null}];if(OB.i===3&&!OB.rin.length)OB.rin=[{n:'',v:null,d:null}];onboard()}else fin()}}

/* ---- démarrage ---- */
function theme(){const t=S.t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.t=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#000000':'#F2F2F7'}
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
$('#fab').innerHTML=ic('plus');$('#fab').onclick=()=>{buzz();if(S.name)addSheet()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&iso(new Date())!==today)render()});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
